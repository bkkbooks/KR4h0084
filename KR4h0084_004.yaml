body:
  text: 古樂府卷四元左克明撰相和曲歌辭上相和漢舊曲也絲竹更相和執節者歌本一部魏明帝分為二晉茍朂採舊辭施用於世謂之清商三調歌詩即沈約所謂因絃管金石造歌以被之者也唐樂志云平調清調瑟調皆周房中曲之遺聲漢世謂之三調又有楚調漢房中樂也與前三調總謂之相和調張永元嘉技録云有吟嘆四曲亦列於相和歌又有大曲十五篇分於諸調唯滿歌行一曲諸調不載故附見於大曲之下云相和曲箜篌引一曰公無渡河崔豹古今注曰箜篌引者朝鮮津卒霍里子髙妻麗玉所作也子高晨起刺船有一白首狂夫披髮提壺亂流而渡其妻隨而止之不及遂墮河而死於是援箜篌而歌聲甚悽愴曲終亦投河而死子髙還以語麗玉麗玉傷之乃引箜篌而寫其聲聞者莫不墮淚飲泣麗玉以其曲傳鄰女麗容名曰箜篌引又有箜篌謡不詳所起大略言結交當有終始與此異也公無渡河公竟渡河墮河而死當奈公何江南曲古辭江南曲古辭云江南可採蓮蓮葉何田田乂云魚戲蓮葉東西南北蓋美其芳晨麗景嬉遊得時也若梁簡文桂楫晚應旋唯歌遊戲又有採菱曲等疑出於此江南可採蓮蓮葉何田田魚戲蓮葉間魚戲蓮葉東魚戲蓮葉西魚戲蓮葉南魚戲蓮葉北梁簡文帝桂楫晚應旋歷岸扣輕舷紫荷擎釣鯉銀筐插短蓮人歸浦口暗那得久回船江南思宋湯惠休幽客海隂路留戍淮陽津垂情向春草知是故鄉人精列魏武帝厥初生造化之陶物莫不有終期莫不有終期聖賢不能免何為懷此憂願螭龍之駕思想昆崘居思想昆崘居見期於迂怪志意在蓬萊志意在蓬萊周孔聖徂落會稽以墳丘會稽以墳丘陶陶誰能度君子以弗憂年之暮奈何時過時來微度關山魏武帝關山古辭曹魏樂奏武帝所賦天地間人為貴言人君當自勤勞省方黜陟省刑薄賦也若梁戴皓昔聼隴頭吟平居已流涕但敘征人行役之思天地間人為貴立君牧民為之軌則車轍馬迹經緯四極黜陟幽明黎庶繁息於鑠賢聖總統邦域封建五爵井田刑獄有燔丹書無普赦贖皋陶甫侯何有失職嗟哉後世改制易律勞民為君役賦其力舜漆食器畔者十國不及唐堯采椽不斫世嘆伯夷欲以厲俗侈惡之大儉為共德許由推讓豈有訟曲兼愛尚同疏者為戚梁戴皓昔聼隴頭吟平居已流涕今日關山望長安樹如薺千里非鄉邑百姓為兄弟軍中大體自相褒其間得意各分曹慱陵輕俠皆無位幽州重氣本多豪馬銜苜蓿葉劒瑩鸊鵜膏初征心未習復值鴈飛入山頭看月近草上知風急笛喝曲難成笳繁響還澀武帝初承平東伐復西征薊門海作塹榆塞氷為城催令四校出倚望三邉平箭服朝來動刀環臨陳鳴將軍一百戰都護五千兵且決雄雌眼前利誰道功名身後事丈夫意氣本自然來時辭第巳聞天但令此身與命在不持烽火照井泉東光古辭古今樂録曰張永元嘉技録云東光舊但弦無音來識造其歌聲東光平蒼梧何不平蒼梧多腐粟無益諸軍糧諸軍遊蕩子早行多悲傷十五魏文帝古今樂録曰十五歌文帝辭後解歌瑟調西山一何髙彭祖稱七百篇辭在瑟調登山而遠望溪谷多所有楩柟千餘尺衆草之盛茂華葉耀人目五色難可紀雉雊山雞鳴虎嘯谷風起號罷當我道狂顧動牙齒薤露歌古辭亦曰泰山吟行喪歌舊曲本出於田橫門人歌以葬橫一章言人命奄忽如薤上露易晞二章言人精魂歸於蒿里至漢武帝時李延年分為二曲薤露送王公貴人蒿里送士大夫庶人挽柩者歌之亦為挽柩歌左氏春秋齊將與吳戰於艾陵公孫夏使其徒歌虞殯杜預注云送葬歌也即喪歌不自田橫始矣曹植擬薤露為天地魏武帝蒿里曲惟傷兵卒死亡薤上露何易晞露晞明朝更復落人死一去何時歸魏曹植天地無窮極隂陽轉相因人居一世間忽若風吹塵願得展功勤輸力於明君懷此王佐才慷慨獨不羣鱗介尊神龍走獸宗麒麟蟲獸猶知德何况於士人孔氏刪詩書王業粲已分騁我徑寸翰流藻垂華芬蒿里曲古辭蒿里誰家地聚斂魂魄無賢愚鬼伯一何相催促人命不得少踟蹰魏武帝關東有義士興兵討羣凶初期會盟津乃心在咸陽軍合力不齊躊躇而鴈行勢利使人爭嗣還自相戕淮南弟稱號刻璽於北方鎧甲生蟣虱萬姓以死亡白骨露於野千里無雞鳴生民百遺一念之絶人腸惟漢行魏曹植太極定二儀清濁始以形三光照八極天道甚著明為人立君長欲以遂其生行仁章以瑞變故誡驕盈神高而聽卑報若響應聲明主敬細微三季瞢天經二皇稱至化盛哉唐虞庭禹湯繼厥德周亦致太平在昔懷帝京日􅉴不敢寧濟濟在公朝萬載馳其名挽歌魏繆襲繆襲惟傷嘆死亡乃人生不免而作此歌生時遊國都死沒棄中野朝發髙堂上暮宿黃泉下白日入虞淵懸車息駟馬造化雖神明安能復存我形容稍歇滅齒髮行當墮自古皆有然誰能離此者對酒魏武帝古辭曹魏樂奏武帝所賦對酒歌太平其旨言王者德澤廣被政理人和萬物咸遂若梁范雲對酒心自足則言但當為樂勿殉名自欺也對酒歌太平時吏不呼門王者賢且明宰相股肱皆忠良咸禮讓民無所爭訟三年耕有九年儲倉穀滿盈班白不負戴雨澤如此百穀用成却走馬以糞其土田爵公侯伯子男咸愛其民以黜陟幽明子養有若父與兄犯禮法輕重隨其刑路無拾遺之私囹圄空虛冬節不斷人耄耋皆得以壽終恩德廣及草木昆蟲梁范雲對酒心自足故人來共持方恱羅襟解誰念髮成絲徇性良為達求名本自欺逮君當歌日及我傾樽時雞鳴古辭古辭雞鳴髙樹巔狗吠深宫中初言天下方太平蕩子何所之次言黃金為門白玉為堂置酒作倡樂為樂方兄弟三人近侍榮耀道路其文與相􅑮狹路間行同終言桃傷而李仆諭兄弟當相為表裏若梁劉孝威雞鳴篇但詠雞而已又有雞鳴髙樹巔皆出於此雞鳴高樹巔狗吠深宫中蕩子何所之天下方太平刑法非有貸柔協正亂名黃金為君門碧玉為軒堂上有雙樽酒作使邯鄲倡劉王碧青甓後出郭門王舍後有方池池中雙鴛鴦鴛鴦七十二羅列自成行鳴聲何啾啾聞我殿東廂兄弟四五人皆為侍中郎五日一時來觀者滿路傍黃金絡馬頭熲熲何煌煌桃生露井上李樹生桃傍蟲來齧桃根李樹代桃殭樹木身相代兄弟還相忘雞鳴篇梁劉孝威塒雞識將曙長鳴高樹巔啄葉疑彰羽排花強欲前意氣多驚舉飄揚獨無侣陳思助鬪協狸膏郈昭妬對敵安金距丹山可愛有鳯凰金門飛舞有鴛鴦何如五德美豈勝千里祥雞鳴高樹巔梁簡文帝碧玉好名倡夫壻侍中郎桃花全覆井金門半隱堂時欣一來下復比雙鴛鴦雞鳴天尚早東烏定未光烏生古辭一曰烏生八九子樂府題解曰古辭云烏生八九子端坐泰氏桂樹間言烏母子本在南山嵓石間而來為秦氏彈丸所殺白鹿在苑中人得以為脯黃鵠摩天鯉在深淵人得而烹煮之則壽命各有定分死生何嘆前後也若梁劉孝威城上烏一年生九雛但詠烏而已不言本事又有城上烏蓋出於此烏生八九子端坐秦氏桂樹間唶我秦氏家有遊遨蕩子工用睢陽強蘇合彈左手持強彈兩丸出入烏東西唶我一丸即發中烏身烏死魂魄飛掦上天阿母生烏子時乃在南山嵓石間唶我人民安知烏子處蹊徑窈窕安從通白鹿乃在上林西苑中射工尚復得白鹿脯唶我黃鵠摩天極高飛後宫尚復得烹煮之鯉魚乃在洛水深淵中釣鈎尚得鯉魚口唶我人民生各各有壽命死生何須復道前後烏生八九子劉孝威城上烏一年生九雛枝輕巢本狹風多葉早枯氄毛不自暖張翼強相呼金柝嚴兮翠樓肅蜃壁光兮椒泥馥虞機衡網不得猜鷹鷙隼鶻無由逐永願共栖曽氏冠同瑞周王屋莫啼城上寒猶賢野間宿羽成翮備各西東丁年賦命有窮通不見高飛帝輦側逺託日輪中尚􅑮王吉箭猶嬰夏羿弓豈如變彩救燕質入夢祚昭公留聲表師退集幕示營空靈臺已鑄像流蘇時候風城上烏梁吳均烏烏城上烏翩翩尾畢逋凡生八九子夜夜啼相呼質微知慮少體賤毛衣粗陛下三萬嵗臣至執金吾梁朱超朝飛集帝城猶帶夜啼聲近日毛雖暖聞弦心尚驚平陵東古辭古辭平陵東松柏桐不知何人劫義公此漢翟義門人所作也義為丞相方進少子字文仲為東郡太守以王莽漢起兵誅之不克而見害門人作歌以怨之如曹植止言神仙事平陵東松柏桐不知何人劫義公劫義公在高堂下交錢百萬兩走馬兩走馬亦誠難顧見追吏心中惻心中惻血出漉歸告我家賣黃犢魏曹植閶闔開天衢通被我羽衣乘飛龍乘飛龍與仙期東上蓬萊採靈芝靈芝採之可服食年若王父無終極陌上桑古辭古辭日出東南隅照我秦氏樓舊説邯鄲女子姓秦名羅敷為邑人千乘王仁妻仁後為趙王家令羅敷出採桑於陌上趙王登臺見而恱之置酒欲奪之羅敷善彈筝作陌上桑以自明不從案其歌辭稱羅敷採桑陌上為使君所􅌽羅敷盛誇其夫為侍中郎以拒之與舊説不同如魏武帝言神仙事晉陸士衡扶桑升朝暉等但歌佳人好會與古辭始同末異日出東南隅照我秦氏樓秦氏有好女自名為羅敷羅敷喜蠶桑採桑城南隅青絲為籠繫桂枝為籠鈎頭上倭墮髻耳中明月珠緗綺為下裙紫衣為上襦行者見羅敷下擔捋髭鬚少年見羅敷脫帽著帩頭耕者忘其犂鋤者忘其鋤來歸相怒怨但坐觀羅敷一解使君從南來五馬立踟蹰使君遣吏往問是誰家姝秦氏有好女自名為羅敷羅敷年幾何二十尚不足十五頗有餘使君謝羅敷寧可共載不羅敷前致辭使君一何愚使君自有婦羅敷自有夫二解東方千餘騎夫壻居上頭何用識夫壻白馬從驪駒青絲繫馬尾黃金絡馬頭腰中鹿盧劒可直千萬餘十五府小史二十朝大夫三十侍中郎四十專城居為人潔白晢鬑鬑頗有鬚盈盈公府步冉冉府中趨坐中數千人皆言夫壻殊三解前豔辭曲後有趨魏武帝駕虹霓乘赤雲登彼九疑歷玉門濟天漢至崑崙見西王母謁東君交赤松及羡門受要祕道愛精神食芝英飲醴泉拄杖桂枝佩秋蘭絶人事遊渾元若疾風遊歘飄翩景未移行數千夀如南山不忘愆梁王筠日出秦樓明條垂露尚盈蠶飢心自急開奩妝不成梁王臺卿令月開和景處處動春心挂筐須葉滿息倦重枝隂豔歌行晉傳玄日出東南隅照我秦氏樓秦氏有好女自字為羅敷首戴金翠飾耳綴明月珠白素為下裾丹霞為上襦一顧傾朝市再顧國為虛問女居安在常在城南居青樓臨大巷幽門結重樞使君自南來駟馬立踟蹰遣吏謝賢女豈可同行車斯女長跪對使君言何殊使君自有婦賤妾有鄙夫天地正厥位願君改其圖日出東南隅晉陸機扶桑升朝暉照此高臺端高臺多妖麗濬房出清顔淑貌耀皎日惠心清且間美目掦玉澤蛾眉象翠翰鮮膚一何潤秀色若可餐窈窕多容儀婉媚巧笑言暮春春服成粲粲綺與紈金雀垂藻翹瓊佩結瑶璠方駕揚清塵濯足洛水瀾藹藹風雲會佳人一何繁南崖充羅幕北渚盈軿軒清川含藻景髙岸一作崖被華丹馥馥芳袖揮泠泠纎指彈悲歌吐清響雅韻播幽蘭丹唇含九秋妍迹凌七盤赴曲迅驚鴻蹈節如集鸞綺態隨顔變沈姿無定源俯仰紛阿那顧步咸可歡遺芳結飛飈浮景映清湍冶容不足詠春遊良可嘆陳殷謀秦樓出佳麗正值朝日光陌頭能駐馬花處復添香日出行周蕭撝昏昏隱逺霧團團乘陳雲正值秦樓女含嬌酬使君吟嘆曲古今樂録曰張永元嘉技録有吟嘆四曲一日大雅吟二曰王明君三曰楚妃嘆四曰王子喬大雅吟王明君楚妃嘆並石崇辭王子喬古辭王明君一曲今有歌大雅吟楚妃嘆二曲今無能歌者古有八曲其小雅吟蜀琴頭楚王吟東武吟四曲闕大雅吟晉石崇堂堂太祖淵𢎞其量仁格宇宙義風遐暢啔土萬里志在翼亮參分有二周文是尚於穆武王奕世載聰欽明沖默文思允恭武則不猛化則時雍庭有儀鳯郊有遊龍啓路千里萬國率從蕩清吳會六合乃同百姓仰德良史書功超越三代唐虞比蹤王明君石崇舊史王嬙字昭君漢元帝時胸奴入朝以嬙配之號胡閼氏一説漢元帝後宫既多不得常見乃使畫工圖其形案圖召幸宫人皆賂畫工多者十萬少者不減五萬昭君自恃其貌獨不與乃惡圖之及後胸奴入朝選美人配之昭君之圖當行及入辭光彩射人悚動左右天子方重信外國悔恨不及窮按其事畫工有杜陵毛延壽為人形醜好老少必得其真安陵陳敞新豐劉白龔寬並工狗馬人形不逮延壽下杜陽望樊青尤善布衆色皆同口棄市籍其資財漢人憐昭君逺嫁為作歌詩始武帝以江都王建女細君為公主嫁烏孫王昆莫令琵琶馬上作樂以慰其道路之思其送明君亦然晉文王諱昭故晉人改為明君石崇有妓曰緑珠善歌舞以此曲教之而自製王明君歌其文悲雅我本漢家子是也琴操載昭君齊國王穰女端正間麗未嘗窺看門户穰以其有異人求之不與年十七獻之元帝帝以地逺不幸備後宫積五六年帝每遊後宫昭君常怨不幸後單于遣使朝賀帝宴之盡召後宫昭君乃盛飾而至帝問欲以一女賜單于誰能行者昭君越席請往時單于使在傍帝驚恨不及昭君至單于大恱以為漢與我厚縱酒作樂遣使報漢送白璧一雙駿馬十匹胡地珍寶之物昭君恨帝始不見遇乃作怨思之歌單于死子世為立昭君于是上書求歸元帝不許會世為亦欲蒸之昭君憤甚乃吞藥而死我本漢家子將適單于庭辭訣未及終前驅已抗旌僕御涕流離轅馬悲且嗚哀鬱傷五內泣淚沾朱纓行行日已逺遂造胸奴城延我於穹廬加我閼氏名殊類非所安雖貴非所榮父子見陵辱對之慙且驚殺身良不易默默以茍生茍生亦何聊積思常憤盈願假飛鴻翼乘之以遐征飛鴻不我顧佇立以屏營昔為匣中玉今為糞上英朝華不足嘉一作歡井與秋草并傳語後世人逺嫁難為情宋鮑照既事轉蓬逺心隨鴈路絶霜鞞旦夕驚邉笳中夜咽梁施榮泰垂羅下椒閣舉袖拂邉塵唧唧撫心嘆蛾眉誤殺人楚妃嘆石崇劉向列女傳曰楚姬楚莊王夫人也莊王好狩獵畢弋樊姬諫不止乃不食禽獸之肉王嘗與虞丘子語以為賢樊姬笑之王曰何笑也對曰虞丘子賢矣未忠也妾充後宫卜三年而所進者九人賢於妾者二人與妾同列者七人虞丘子相楚十年而所薦者非其子孫則族昆弟未聞進賢退不肖也妾之笑不亦冝乎王於是以孫叔敖為令尹治楚三年而莊王以霸樂府解題曰陸機吳趍行云楚妃且勿嘆明非近題也蕩蕩大楚跨上萬里北據方城南接交趾西撫巴漢東被海涘五侯九伯是疆是理矯矯莊王淵停嶽峙冕旒垂精充纊塞耳韜光戢耀濳默恭已內委樊姬外任孫子猗猗樊姬體道履信既絀虞丘九女是進杜絶邪佞廣啓令胤割歡抑寵居之不吝不吝實難可謂知幾化自近始著於閨闈光佐霸業邁德掦威羣后列辟式瞻洪規譬彼江海百川咸歸萬邦作歌身沒名飛昭君辭張正見塞樹暗邉塵霜樓明漢月淚染上春衣憂變華年髮隋何妥昔聞别鶴弄已自軫離情今來昭君曲還悲秋草并梁武陵王紀塞外無春色邉城有風霜誰堪覽明鏡持許照紅妝王子喬古辭劉向列仙傳曰王子喬者周靈王太子晉也好吹笙作鳯鳴遊伊洛之間道人浮丘公接以上嵩髙山三十餘年後求之於山上見桓良曰告我家七月七日待我於緱氏山頭至時果乘白鶴駐山頭望之不得到舉手謝時人數日而去為立祠於緱氏山下及嵩髙之首焉王子喬參駕白鹿雲中遨參駕白鹿雲中遨下遊來王子喬參駕白鹿上至雲戲遊遨上建逋隂廣里踐近高結仙宫過謁三台東遊四海五嶽上過蓬萊紫雲臺三王五帝不足令令我聖朝應太平養民若子事父明當究天祿永康寧玉女羅坐吹笛簫嗟行聖人遊八極鳴吐銜福翔殿側聖主享萬年悲吟皇帝延壽命平調曲長歌行古辭古辭青青園中葵朝露待日晞言芳華不久當努力為樂無至老大乃傷悲也曹魏改奏文帝所賦西山亦何髙言仙道洪蒙不可識如王喬赤松皆空言虛辭迂怪難信當觀聖道而已若晉陸士衡逝矣經天日復言人運短促當乘間長歌不與古文合青青園中葵朝露待日晞陽春布德澤萬物生光輝常恐秋節至焜黃華葉衰百川東到海何時復西歸少壯不努力老大徒傷悲古辭仙人騎白鹿髮短耳何長導我上太華攬芝獲赤幢來到主人門奉藥一玉箱主人服此藥身體一日康強髮白更黑延年壽命長岧岧山上亭皎皎雲間星逺望使心思遊子戀所生驅車出北門遙觀洛陽城凱風吹長棘夭夭枝葉傾黃鳥飛相追咬咬弄音聲佇立望西河泣下沾羅纓魏文帝西山亦何高高高垂無極上有兩仙僮不飲亦不食與我一丸藥光耀有五色一解服藥四五日身體生羽翼輕舉乘浮雲倐忽行萬億流覽觀四海茫茫非所識二解彭祖稱七百悠悠安可原老聃適西戎于今竟不還王喬假虛辭赤松垂空言三解達人識真偽愚夫好妄傳追念往古事憒憒千萬端百家多迂怪聖道我所觀四解晉陸機逝矣經天日悲哉帶地川寸隂無停晷尺波徒自旋年往迅徑矢時來亮急弦逺期鮮克及盈數固希全容華夙夜零體澤坐自捐兹物茍難停吾壽安得延俯仰逝將過倐忽幾何間慷慨亦焉訴天道良自然但恨功名薄竹帛無所宣逮及歲未暮長歌乘我間蝦鱔篇魏曹植一曰蝦鱔篇樂府解題曰魏曹植擬長歌行為蝦鱔蝦鱔遊潢潦不知江海流燕雀戲藩柴安識鴻鵠遊世事此誠明大德固無儔駕言登五嶽然後小陵丘俯觀上路人勢利惟是謀讎高念皇家逺懷柔九州撫劒而雷音猛氣縱橫浮泛泊徒嗷嗷誰知壯士憂短歌行魏武帝魏武帝對酒當歌人生幾何晉陸士衡置酒髙堂悲歌臨觴皆言當及時為樂又舊説長歌短歌大率言人壽命長短分定不可妄求也對酒當歌人生幾何譬如朝露去日苦多慨當以慷憂思難忘何以解憂唯有杜康青青子襟悠悠我心但為君故沈吟至今呦呦鹿鳴食野之蘋我有嘉賔鼓瑟吹笙明明如月何時可掇憂從中來不可斷絶越陌度阡枉用相存契闊談宴心念舊恩月明星稀鳥鵲南飛繞樹三匝何枝可依山不厭高海不厭深周公吐哺天下歸心六解晉陸機置酒高堂悲歌臨觴人生幾何逝如朝霜時無重至華不再掦蘋以春暉蘭以秋芳來日苦短去日苦長今我不樂蟋蟀在房樂以會興悲以别章豈日無感憂為子忘我酒既旨我肴既臧短歌可詠長夜無荒銅雀臺陳張正見一曰銅雀妓鄴都故事曰魏武帝遺命諸子曰吾死之後葬於鄴之西岡上與西門豹祠相近無藏金玉珠寶餘者可分諸夫人不命祭吾妾與妓人皆著銅雀臺臺上施六尺牀下繐帳朝晡止酒脯粻糒之屬每月朔十五輒向帳前作伎汝等時登臺望吾西陵墓田故陸機弔魏武帝文曰揮清絃而獨奏薦脯糒而誰嘗悼總帳之溟漢怨西陵之茫茫登雀臺而羣悲佇美目其何望按銅雀臺在鄴城建安十五年築其臺最高上有屋一百二十間連接榱棟侵徹雲漢鑄大銅雀置於樓顚舒翼奮尾勢若飛動因名為銅雀臺樂府解題曰後人悲其意而為之詠也淒涼銅雀晚搖落墓田通雲慘當歌日松吟欲舞風人疏瑶席泠曲罷繐帷空可惜年將泪俱盡望陵中銅雀妓齊謝朓繐帷飄井幹樽酒若平生鬱鬱西陵樹詎聞歌吹聲芳襟染淚迹嬋娟空復情玉座猶寂寞况乃妾身輕猛虎行魏文帝古辭曰飢不從猛虎食暮不從野雀棲野雀安無巢遊子為誰驕魏明帝辭曰雙桐生空井枝葉自相加通泉溉其根玄雨潤其柯古今樂録曰猛虎行王僧虔技録曰荀録所載明帝雙桐一篇今不傳樂府解題曰晉陸機云渴不飲盜泉水言從逺役猶耿介不以艱險改節也又有雙桐生空井亦出於此與君媾新歡託配於仁儀充列於紫微升降焉可知梧桐攀鳯翼雲雨散洪池晉陸機渴不飲盜泉水熱不息惡木隂惡木豈無枝志士多苦心整駕肅時命杖䇿將遠尋飢食猛虎窟寒栖野雀林日歸功未建時往歲載隂崇雲臨岸駭鳴條隨風吟靜言幽谷底長嘯高山岑急弦無懦響亮節難為音人生誠未易曷云開此襟眷我耿介懷俯仰愧古今雙桐生空井梁簡文帝季月對桐井新枝雜舊株晚葉藏栖鳯朝花拂曙烏還看稚子照銀牀繫轆轤君子行古辭樂府解題口古辭云君子防未然蓋言逺嫌疑也又有君子有所思行辭旨與此不同君子防未然不處嫌疑間瓜田不納履李下不正冠嫂叔不親授長幼不比肩勞謙得其柄和光甚獨難周公下白屋吐哺不及餐一沭三握髮後世稱聖賢燕歌行魏文帝晉樂奏魏文帝秋風蕭瑟天氣涼别日何易會日難等二篇言時序遷換而行役不歸佳人怨曠無所訴也秋風蕭瑟天氣涼草木搖落露為霜一解羣燕辭歸鴈南翔念君客遊多思腸二解慊慊思歸戀故鄉君何淹留寄他方三解賤妾煢煢守空房憂來思君不敢忘四解不覺淚下沾衣裳援瑟鳴絃發清商五解短歌微吟不能長明月皎皎照我床六解星漢西流夜未央牽牛織女遙相望爾獨何辜限河梁七解魏文帝別日何易會日難山川悠逺路漫漫一解鬱陶思君未敢言寄書浮雲往不還二解涕零雨面毁容顔誰能懷憂獨不嘆三解展詩清歌聊自寬樂往哀來摧肺肝四解耿耿伏枕不能眠披衣出户步東阡五解悲風清厲秋氣寒羅帷徐動經秦軒六解仰看星月觀雲間飛鶬晨鳴聲可憐留連顧懷不能存七解魏明帝白日晼晼忽西傾霜露慘悽塗階庭秋草捲葉摧枝莖翩翩飛蓬常獨征有似遊子不安寧從軍行魏王粲皆述軍旅苦辛之詞也從軍有苦樂但問所從誰所從神且武焉得久勞師相公征關右赫怒震天威一舉滅獯虜再舉服羌夷西收邉地賊忽若俯拾遺陳賞越丘山酒肉踰川坻軍中多飫饒人馬皆溢肥徒行兼乘還空出有餘資拓地三千里往返一作反速如一作若飛歌舞入鄴城所願獲無違晝一作盡日處大朝日暮薄言歸外參時明政內不廢家私禽獸憚為犧良苖實已揮竊慕負鼎翁願厲朽鈍姿不能效沮溺相隨把鋤犁熟覽夫子詩信知所言非周趙王遼東烽火照井泉薊北亭障接燕然水凍菖蒲未生節關寒榆葉不成錢從軍五更轉陳伏知道樂苑曰五更轉商調曲按伏知道已有從軍辭則五更轉蓋陳已前曲也一更刁斗鳴校尉逴連城遙聞射雕騎懸憚將軍名二更愁未央高城寒夜長試將弓學月聊持劒比霜三更夜警新橫吹獨吟春強聽梅花落誤憶栁園人四更星漢低落月與雲齊依稀北風裏胡笳雜馬嘶五更催送籌曉色映山頭城烏初起堞更人悄一作笑下樓鞠歌行晉陸機古辭三七言言雖竒寶名器不遇知己終不見重願逢知己以託意焉朝雲升應龍攀乘風逺遊騰雲端鼓鐘歇豈自歡急弦髙張思和彈時希值年夙愆循已雖易人知難王陽登貢公歡罕生既沒國子歎嗟千載豈虛言邈矣逺念情愾然清調曲苦寒行魏文帝晉樂奏魏武帝北上太行山備言氷雪溪谷之苦或謂北上太行山蓋因魏武帝作此辭今人效之北上太行山艱哉何巍巍羊腸坂詰屈車輪為之摧樹木何蕭瑟北風聲正悲熊羆對我蹲虎豹夾路啼溪谷少人民雪落何霏霏延頸長嘆息逺行多所懷我心何怫鬱思欲一東歸水深橋梁絶中道正徘徊迷惑失故路薄暮無所棲行行日已逺人馬同時飢簷囊行取薪斧氷持作糜悲彼東山詩悠悠使我哀豫章行晉陸機古辭今闕誤不傳陸士衡泛舟凊川渚傷離别言壽短景馳容華不久若曹植擬豫章行為窮達傅休奕苦相篇云苦相身為女言盡力於人終以華落見棄亦題曰豫章行泛舟清川渚遙望高一作南山隂川陸殊途一作塗軌懿親將逺尋三荆歡同株四鳥悲異林樂會良自古悼别豈獨今寄世將幾何日􅉴無停隂前路既已多後途隨年侵促促薄暮景亹亹鮮克禁曷為復以兹曾是懷苦心逺節嬰物淺近情能不深行矣保嘉福景絶繼以音魏曹植窮達難豫圖禍福信亦然虞舜不逢堯耕耘處中田太公未遭文漁釣終渭川不見魯孔子窮困陳蔡間周公下白屋天下稱其賢鴛鴦自用親不若比翼連他人雖同盟骨肉天性然周公穆康叔管蔡則流言子臧讓千乘季札慕其賢豫章行苦相篇晉傅玄苦相身為女卑陋難再陳兒男當門户墮地自生神雄心志四海萬里望風塵女育無欣愛不為家所珍長大逃深室藏頭羞見人垂淚適他鄉忽如雨絶雲低頭和顔色素齒結朱唇跪拜無復數婢妾如嚴賔情合同雲漢葵藿仰陽春心乖甚水火百惡集其身玉顔隨年變丈夫多好新昔為形與影今為胡與秦胡秦時相見一絶踰參辰董逃行古辭古辭吾欲上謁從高山山頭危險道路難言五嶽之上皆以黃金為宫闕而多靈獸仙草以求長生不死之術令天神擁護君上以壽考也舊説董逃行後漢遊童所歌終有董卓作亂卒以逃亡後人習之為歌章樂府奏之以為警誡焉陸機和風習習薄林但言節物方華可及時行樂無使徂齡坐徙而已吾欲上謁從高山山頭危險道路難遙望五嶽端黃金為闕班璘但見芝草葉落紛紛一解百鳥集來如煙山獸紛綸麟辟邪其端鵾雞聲鳴但見山獸援戲相拘攀二解小復前行玉堂未心懷流還傳教出門來門外人何求所言欲從聖道求一得命延三解教敕凡吏受言採取神藥若木端白兔長跪搗藥蝦蟆丸奉上陛下一玉柈服此藥可得神仙四解服爾神藥莫不歡喜陛下長生老壽四面肅肅稽首天神擁護左右陛下長與天相保守五解晉陸機和風習習薄林柔條布葉垂隂鳴鳩拂羽相尋倉庚喈喈弄音感時悼逝傷心日月相追周旋萬里倐忽幾年人皆冉冉西遷盛時一往不還慷慨乖念悽然昔為少年無憂常怪秉燭夜遊翩翩宵征何求於今知此有由但為老去年遒盛固有衰不疑長夜冥冥無期何不驅馳及時聊樂永日自怡齎此遺情何之人生居世為安豈若及時為歡世道多故萬端憂慮紛錯交顔老行及之長嘆相逄行古辭一曰相逄狹路間行亦曰長安有狹斜行樂府解題曰古辭文意與雞鳴曲同晉陸機長安狹斜行云伊洛有岐路岐路交朱輪則言世路險狹邪僻正直之士無所措手足矣相逢狹路間道隘不容車不知何年少夾轂問君家君家誠易知易知復難忘黃金為君門白玉為君堂堂上置樽酒作使邯鄲倡中庭生桂樹華燈何煌煌兄弟兩三人中子為侍郎五日一來歸道上自生光黃金絡馬頭觀者盈道傍入門時左顧但見雙鴛鴦鴛鴦七十二羅列自成行音聲何噰噰鶴鳴東西廂大婦織綺羅中婦織流黃小婦無所為挾瑟上高堂丈人且安坐調絲方未央長安有狹斜行古辭長安有狹斜狹斜不容車適逢兩少年挾轂問君家君家新市傍易知復難忘大子二千石中子孝亷郎小子無官職衣冠仕洛陽三子俱入室室中自生光大婦織綺紵一作羅中婦織流黃小婦無所為挾琴上高堂丈人且徐徐調絃詎未央晉陸機伊洛有岐路岐路交朱輪輕蓋承華景騰步躡飛塵鳴玉豈朴儒馮軾皆俊民烈心厲徑秋麗服鮮芳春余本倦遊客豪彥多舊親傾蓋承芳訊欲鳴當及晨守一不足矜岐路良可遵規行無曠迹矩步豈逮人投足緒已爾四時不必循將遂殊塗軌要子同歸津塘上行魏武帝前志云晉樂奏魏武帝蒲生我池中而諸集録皆言其辭魏文帝甄后所作歎以讒訴見棄猶幸得新好不遺故惡焉若晉陸機江蘺生幽渚言婦人衰老失寵行於塘上而為此歌蓋與古辭同意蒲生我池中其葉何離離傍能行仁義莫若妾自知衆口鑠黃金使君生別離念君去我時獨愁常苦悲想見君顔色感結傷心脾念君常苦悲夜夜不能寐莫以豪賢故棄捐素所愛莫以魚肉賤棄捐蔥與薤莫以麻枲賤棄捐菅與蒯出亦復苦愁入亦復苦愁邉地多悲風樹木何修修從君致獨樂延年壽千秋晉陸機江蘺生幽渚微芳不足宣被蒙風雲會移居華池邉發藻玉臺下垂影滄浪泉一作淵霑潤既已渥結根奧且堅四節逝不處繁華難久鮮淑氣與時殞餘芳隨風捐天道有遷易人理無常全男歡智傾愚女愛衰避妍不惜微軀退但懼蒼蠅前願君廣末光照妾薄暮年蒲生行浮萍篇魏曹植浮萍寄清水隨風東西流結髮辭嚴親來為君子仇恪勤在朝夕無端獲罪尤在昔蒙恩惠和樂如瑟琴何意今摧頺曠若商與參茱茰自有芳不若桂與蘭新人雖可愛無若故所歡行雲有返期君恩儻中還慊慊仰天嘆愁心將何訴日月不恆處人生忽若寓悲風來入懷淚下如垂露發篋造裳衣裁縫紈與素秋胡行魏文帝舊説魯有秋胡納妻五日而宦於陳五年乃歸未至家於路傍見婦人採桑色美恱之下車謂曰力田不如逢豐年力桑不如見國卿今吾有金願以與汝婦人曰婦人當採桑力作以養舅姑不願人之金秋胡歸至家奉金遺母母使人呼婦婦至乃向採桑婦也婦惡其行因東走投河而死後人哀之而作焉若魏文帝云堯任舜禹當復何為魏武帝云晨上散關山此道當何難各言其事俱題之曰秋胡行而不取秋胡事也獨傳玄詩追述其實也堯任舜禹當復何為百獸率舞鳯凰來儀得人則安失人則危唯賢知賢人不易知歌以永言誠不易移鳴條之役萬舉必全明德通靈降福自天魏武帝晨上散關山此道當何難晨上散關山此道當何難牛頓不起車墮谷間坐盤石之上彈五絃之琴作為清角韻意中迷煩歌以言志晨上散關山一解有何三老公卒來在我傍有何三老公卒來在我傍負掩被裘似非恆人謂卿云何困苦以自怨徨徨所欲來到此間歌以言志有何三老公二解我居崑崙山所謂者真人我居崑崙山所謂者真人道深有可得名山歷觀遨遊八極枕石漱流飲泉沉吟不決遂上升天歌以言志我居崑崙山三解去去不可追長恨相牽攀去去不可追長恨相牽攀夜夜安得寐惆悵以自憐正而不譎乃賦依因經傳所過西來所傳歌以言志去去不可追四解晉傅玄秋胡納令室三日宦他卿皎皎潔婦姿泠泠守空房燕婉不終夕別如參與商憂來猶四海易感難可防人言生日短愁者苦夜長百草掦春華攘腕採柔桑素手尋繁枝落葉不盈筐羅衣翳玉體回目流采章君子倦仕歸車馬如龍驤精誠馳萬里既去兩相忘行人恱令顔借息此樹傍誘以逢卿喻遂下黃金裝烈烈貞女忿言辭厲秋霜長驅及居室奉金升北堂母立呼婦來歡情樂未央秋胡見此婦惕然懷探湯負心豈不慚永誓非所望清濁自異源鳬鳯不並翔引身赴長流果哉潔婦腸彼夫既不淑此婦亦太剛古樂府卷四
