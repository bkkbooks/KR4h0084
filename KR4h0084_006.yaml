body:
  text: 古樂府卷六元左克明撰清商曲歌辭上清商樂一曰清樂清樂者九代之遺聲其始即相和三調是也并漢魏已來舊曲其辭皆古調晉馬南渡其音亡散宋武定關中收其聲伎南朝文物斯為最盛焉後魏孝文宣武相繼南伐得江左所傳舊曲及江南吳歌荆楚西聲總謂之清商至於殿庭饗宴則兼奏之後隋平陳文帝善其節奏曰此華夏正聲也乃微更損益以新定律吕因於太常置清商署以管之謂之清樂隋室喪亂日益淪缺唐貞觀中用十部樂清樂亦在焉至武后長安已後朝廷不重古曲工伎廢弛於吳音轉逺矣曲之存者僅有子夜上聲歡聞前溪阿子丁督護讀曲神弦等曲俱列於吳聲而西曲則石城樂烏夜啼烏栖曲估客莫愁襄陽江陵共戲夀陽等曲或舞曲或倚歌則雜出於荆郢樊鄧之間以其方俗故謂之西曲及梁天監中武帝改西曲製江南㺯為龍笛採蓮採菱曲沈約製鳳笙等曲與西曲總列於清商云吳聲歌子夜歌古辭子夜晉曲也晉有女子名子夜造此聲聲過哀苦樂府解題云後人更為四時行樂之詞謂之子夜四時歌又有太子夜歌子夜變歌子夜警歌皆曲之變也宿昔不梳頭絲髮被兩肩婉伸郎膝上何處不可憐始欲識郎時兩心望如一理絲入殘機何悟不成匹﨑嶇相怨慕始獲風雲通玉牀語石闕悲思兩心同見娘善容媚願得結金蘭空織無經緯求匹理自難前絲斷纏綿意欲結交情春蠶易感化絲子巳復生自從别郎來何日不咨嗟黃蘗鬱成林當奈苦心多朝思出前門暮思還後渚語笑向誰道腹中隂憶汝攬枕北忩卧郎來就儂嬉小喜多唐突相憐能幾時年少當及時蹉跎日就老若不信儂語但看霜下草常慮有二意歡今果不齊枯魚就濁水長與清流乖道近不得數遂致盛寒違不見東流水何時復西歸舉酒待相勸酒還杯亦空願因微觴㑹心感色亦同儂年不及時其於作乖離素不知浮萍轉動春風移歡從何處來端然有憂色三喚不一應有何比松柏氣清明月朗夜與君共嬉郎歌妙意曲儂亦吐芳詞驚風急素柯白日漸微濛郎懷幽閨性儂亦恃春容我念歡的的子行由豫情霧露隱芙蓉見蓮不分明儂作北辰星千年無轉移歡行白日心朝東暮還西憐歡好情懷移居作鄉里桐樹生門前出入見梧子寢食不相忘同坐復俱起玉藕金芙蓉無稱我蓮子子夜四時歌古辭春歌光風流月初新林錦花舒情人戲春月窈窕曵羅裾碧樓冥初月羅綺垂新風含春未及歌桂酒發清容朱光照緑苑丹華粲羅星那能閨中繡獨無懷春情春林花多媚春鳥意多哀春風復多情吹我羅裳開昔别雁集渚今還燕巢梁敢辭嵗月久但使逢春陽春園花就黃陽池水方渌酌酒初滿杯調絃始終曲明月照桂林初花錦繡色誰能不相思獨在機中織﨑嶇與時競不復自顧慮春風振榮林常恐華落去思見春花月含笑當道路逢儂多欲擲可憐持自誤自從别歡後歎音不絶響黃蘗向春生苦心隨日長夏歌髙堂不作壁招取四面風吹歡羅裳開動儂含笑容反覆華簟上屏帳了不施郎君未可前待我整容儀春别猶春戀夏還情更久羅帳為誰褰雙枕何時有疊扇放床上企想逺風來輕袖拂華牀窈窕登髙臺含桃巳中食郎贈合歡扇深感同心意蘭室期相見田蠶事巳畢思婦猶苦身當暑理絺服持寄與行人朝登凉臺上夕宿蘭池裏乘月採芙蓉夜夜得蓮子昔别春風起今還夏雲浮路遙日月促非是我淹留春桃初發紅惜色恐儂擲朱夏花落去誰復相尋覔輕衣不重綵飈風故不凉三伏何時過許儂紅粉粧秋歌風清覺時凉明月天色髙佳人理寒服萬結砧杵勞清露凝如玉凉風中夜發情人不還卧冶遊步明月開窗秋月光滅燭解羅裳含笑帷幌裏舉體蘭蕙香飄飄初秋夕明月耀秋輝握腕同遊戲庭含媚素歸秋夜凉風起天髙星月明蘭房競妝飾綺帳待雙情凉秋開窗寢斜月垂光照中宵無人語羅幌有雙笑初寒八九月獨纏自絡絲寒衣尚未了郎喚儂底為仰頭看桐樹桐花特可憐願天無霜雪梧子解千年秋夜入窗裏羅帳起飄揚仰頭看明月寄情千里光别在三陽初望還九秋暮惡見東流水終年不西顧冬歌淵冰厚三尺素雪覆千里我心如松柏君情復何似塗澀無人行冒寒往相覔若不信儂時但看雪上跡寒鳥依髙樹枯林鳴悲風為歡憔悴盡那得好顔容昔别春草緑今還墀雪盈誰知相思老𤣥鬢白髮生炭爐却夜寒重袍坐疊褥與郎對華榻弦歌秉蘭燭冬林葉落盡逢春巳復曜葵藿生谷底傾心不䝉照嚴霜白草木寒風晝夜起感時為歡歎霜鬢不可視何處結同心西林柏樹下晃蕩無四壁嚴霜凍殺我白雪停隂岡丹華耀陽林何必絲與竹山水有清音果欲結金蘭但看松柏林經霜不墮地歲寒無異心子夜四時歌春歌梁武帝蘭葉始滿地梅花已落枝持此可憐意摘以寄心知夏歌含桃落花日黃鳥營飛時君住馬欲疲妾去蠶已饑秋歌繡帶合歡結錦衣連理文懷情入夜月含笑出朝雲冬歌寒閨動黻帳密筵重錦席賣眼拂長袖含笑留上客太子夜歌古辭歌謡數百種子夜最可憐慷慨吐清音明轉出天然絲竹發歌響假器揚清音不知歌謡妙聲勢出口心子夜警歌古辭鏤碗傳緑酒雕爐薰紫煙誰知苦寒調共作白雪絃恃愛如欲進含羞出不前朱口發豔歌玉指弄嬌絃子夜變歌古辭宋書樂志曰六變諸曲皆因事制歌古今樂録曰子夜變歌前作持子送後作歡娛我送子夜警歌無送聲仍作變故呼為變頭謂六變之首也人傳歡負情我自未常見三更開門去始知子夜變歲月如流邁春盡秋巳至熒熒條上花零落何乃駛歲月如流邁行已及素秋蟋蟀吟堂前惆悵使儂愁上聲歌晉宋梁辭古今樂録曰上聲歌者此因上聲促柱得名或用一調或用無調名如古歌辭所言謂哀思之音不及中和梁武因之改辭無復雅句儂本是蕭草持作蘭桂名芬芳頓交盛感郎為上聲郎作上聲曲柱促使弦哀譬如秋風急觴遇傷儂懷初歌子夜曲改調促鳴筝四座暫寂靜聽我歌上聲新衫繡兩襠迮著羅裙裏行步動微塵羅裙隨風起歡聞歌古辭古今樂録曰歡聞歌者晉穆帝升平初歌畢輒呼汝聞否後人演其聲因此為曲名今世用莎持乙子代之語稍訛異也遙遙天無柱流漂萍無根單身如螢火持底報郎恩歡聞變歌古辭古今樂録曰歡聞變歌者晉穆帝升平中童子輩忽歌於道曰阿子聞曲終輒云阿子汝聞不聲既悽苦因以名之歡來不徐徐陽窗都鋭戶耶婆尚未眠肝心如推櫓張罾不得魚不櫓罾不歸君非鸕鷀鳥底為守空池刻木作班鷦有翅不能飛搖著帆檣上望見千里磯駛風何曜曜帆上牛渚磯帆作繖子張船如侣馬馳王金珠南有相思木合影復同心遊女不可求誰能識得音前溪歌古辭宋書樂志曰前溪歌者晉車騎將軍沈珫所製郗昂樂府解題曰前溪舞曲也憂思出門倚逢郎前溪度莫作流水心引新都捨故為家不鑿井檐瓶下前溪開穿亂漫下但聞林鳥啼逍遙獨桑頭北望東武亭黃瓜被山側春風感郎情黃葛生爛熳誰能斷葛根寧斷嬌兒乳不斷郎殷勤黃葛結䝉蘢生在洛溪邊花落逐水去何當順流還還亦不復鮮逍遙獨桑頭東北無廣親黃瓜是小草春風何足歎憶汝涕交零前溪滄浪映通波澄渌清聲弦傳不絶千載寄汝名永與天地并阿子歌王金珠宋書樂志曰阿子歌者亦因升平初歌云阿子汝聞不後人演其聲為阿子歡聞二曲樂苑曰嘉興人養鴨兒鴨兒既死因有此歌未知孰是可憐雙飛鳬飛集野田頭饑食野田草渴飲清河流丁督護歌宋武帝一曰阿督護宋書樂志曰督護歌者彭城內史徐逵之為魯軌所殺宋髙祖使府內直督護丁旿收斂殯埋之逵之妻髙祖長聓也呼旿至閣下自問斂逵之事每問輒歎息曰丁督護其聲哀切後人因其聲廣其曲焉督護北征去前鋒無不平朱門垂髙蓋永世揚功名洛陽數千里孟津流無極辛苦戎馬間别易㑹難得督護北征去相送落星墟帆檣如芒柳督護今何渠督護初征時儂亦惡聞許願作石尤風四面斷行旅聞歡去北征相送直瀆浦只有淚可出無復情可吐團扇郎古辭古今樂録曰團扇郎歌者晉中書令王珉捉白團扇與嫂婢謝芳姿有愛情好甚篤嫂捶撻婢過苦王東亭聞而止之芳姿素善歌嫂令歌一曲當赦之應聲歌曰白團扇辛苦五流連是郎眼所見珉聞更問之汝歌何遺芳姿即改云白團扇憔悴非昔容羞與郎相見後人因而歌之七寶畫團扇燦爛明月光餉郎却暄暑相憶莫相忘青青林中竹可作白團扇動搖郎玉手因風托方便團扇薄不搖窈窕搖蒲葵相憐中道罷定是阿誰非團扇復團扇持許自遮面憔悴無復理羞與郎相見七日夜女歌古辭婉孌不終夕一别周年期桑蠶不作繭晝夜長懸絲風驂不駕纓翼人立中庭簫管且停吹展我叙離情長史變歌古辭宋書樂志曰長史變歌者晉司徒左長史王廞臨敗所制也出儂吳昌門清水緑碧色徘徊戎馬間求罷不能得黃鵠曲古辭列女傳曰魯陶嬰者魯陶明之女也少寡養幼孤無疆昆弟紡績為産魯人或聞其義將求焉嬰聞之恐不得免乃作歌明已之不更二庭也其歌曰悲夫黃鵠之早寡兮七年不雙宛頸獨宿兮不與衆同夜半悲鳴兮想其故雄天命早寡兮獨宿何傷寡婦念此兮泣下數行嗚呼哀哉兮死者不可忘飛鳥尚然兮况於貞良雖有賢雄兮終不重行魯人聞之不敢復求按黃鵠本漢橫吹曲名黃鵠參天飛半道鬱徘徊腹中車輪轉君知思憶誰黃鵠參天飛半道還哀鳴三年失羣侣生離傷人情碧玉歌古辭樂苑曰碧玉歌者宋汝南王所作也碧玉汝南王妾名以寵愛之甚所以歌之碧玉破瓜時郎為情顛倒芙蓉凌霜榮秋容故尚好碧玉小家女不敢攀貴德感郎千金意慙無傾城色桃葉歌古辭古今樂録曰桃葉歌者晉王子敬之所作也桃葉子敬妾名緣於篤愛所以歌之隋書五行志曰陳時江南盛歌王獻之桃葉詞云桃葉復桃葉江不用楫但渡無所苦我自迎接汝後隋晉王廣伐陳置將桃葉山下及韓擒虎渡江大將任蠻奴至新亭以導北軍之應子敬獻之字也桃葉映紅花無風自婀娜春花映何限感郎獨採我桃葉復桃葉桃樹連桃根相憐兩樂事獨使我殷勤桃葉復桃葉渡江不用楫但渡無所苦我自來迎接桃葉復桃葉渡江不待櫓風波了無常沒命江南渡長樂佳古辭雎鳩不集林體潔好清流貞節曜竒世長樂戲汀洲鴛鴦翻碧樹皆以戲蘭渚寢食不相離長莫過時許紅羅復斗帳四角垂朱璫玉枕龍鬚席郎眠何處床懊憹歌古辭古今樂録曰懊憹歌者晉石崇緑珠所作唯絲布澀難縫一曲而已寡婦哭城穨此情非虛假相樂不相得抱恨黃泉下我有一所歡安在深閣裏桐樹不結花何由得梧子長檣鐡鹿子布帆阿那起詫儂安在間一去三千里暫薄牛渚磯歡不下廷板水深沾儂衣白黑何在浣月落天欲曙能得幾時眠悽悽下牀去儂病不能言山頭草歡少四面風趨使儂顛倒華山畿古辭古今樂録曰華山畿者宋少帝時懊惱一曲亦變曲也少帝時南徐一士子從華山畿往雲陽見客舍有女子年十八九恱之無因遂感心疾母問其故具以啓母母為至華山尋訪見女具說聞感之因脫蔽膝令母密置其席下卧之當已少日果差忽舉席見蔽膝而抱持遂吞食而死氣欲絶謂母曰葬時車載從華山度母從其意比至女門牛不肯前打拍不動女曰且待須臾妝㸃沐浴既而出歌曰華山畿君既為儂死獨活為誰施歡若見憐時棺木為儂開棺應聲開女透入棺家人叩打無如之何乃合葬呼曰神女冡啼相憶淚如漏刻水晝夜流不息相送勞勞渚長江不應滿是儂淚成許讀曲歌古辭宋書樂志曰讀曲歌者民間為彭城王義康所作也古今樂録曰讀曲歌者元嘉十七年袁后崩百官不敢作聲歌或因酒宴上竊聲讀曲細吟而巳紅藍與芙蓉我色與歡敵莫案石榴花厯亂聽儂摘千葉紅芙蓉照灼緑水邊餘花任郎摘慎莫罷儂蓮上樹摘桐花何悟枝枯燥迢迢空中落遂為梧子道栁樹得春風一低復一昂誰能空相憶獨眠度三陽折楊栁百鳥園林啼道歡不離口通髮不可料憔悴為誰睹欲知相憶時但看裙帶緩幾許憶歡不能食徘徊三路間因風覔消息奈何許石闕生口中銜碑不得語初陽正二月草木鬱青青躡履步前園時物感人情桃花落巳盡愁思猶未央春風難期信託情明月光五鼓起開門正見歡子度何處宿行還衣被有霜露歔欷暗中啼斜日照帳裏無油何所苦但使天明爾儂心常慊慊歡行由預情霧露隱芙蓉見蓮詎分明種蓮長江邊藕生黃蘗浦必得蓮子時流離經辛苦暫出白門前楊栁可藏烏歡作沈水香儂作慱山爐十期九不果常抱懷恨生然燈不下炷有油那得明下帷燈火盡朗月照懷裏無油何所苦但令天明爾閨閣斷信使的的兩相憶譬如水上影分明不可得逍遙待曉分轉側聽更鼓明月不應停特為思君苦罷去四五年相見論故情殺荷不斷藕蓮心已復生黃竹子歌古辭唐李康成曰黃竹子歌江陵女歌皆今時吳歌也江邊黃竹子堪作女兒箱一船使兩槳得娘還故鄉神弦歌古辭古今樂録曰神弦歌十一曲一曰宿阿二曰道君三曰聖郎四曰嬌女五曰白石郎六曰青溪小姑七曰湖就姑八曰姑恩九曰採菱童十曰明下童十一曰同生宿阿曲蘇林開天門趙尊閉地戶神靈亦道同真官今來下道君曲中庭有樹自語梧桐推枝布葉聖郎曲左亦不佯佯右亦不翼翼仙人在郎傍玉女在郎側酒無沙糖味為他通顔色嬌女詩北遊臨河海遙望中菰菱芙蓉發盛華渌水清且澄絃歌奏聲節髣佛有餘音蹀躞越橋上河水東西流上有神仙居一作仙聖下有西流魚行不獨自去三三兩兩俱白石郎曲白石郎臨江居前導江伯後從魚積石如玉列松如翠郎豔獨絶世無其二青溪小姑曲開門白水側近橋梁小姑所居獨處無郎湖就姑曲赤山湖就頭孟陽二三月緑蔽賁荇藪湖就赤山磯大姑居湖東仲姑居湖西姑恩曲明姑遵八風蕃謁雲日中前導陸離獸後從朱鳥麟鳯凰苕苕山頭柏冬夏葉不衰獨當被天恩枝葉華葳蕤採蓮童曲泛舟採菱葉過摘芙蓉花扣楫命童侣齊聲採蓮歌東湖扶菰童西湖採菱芰不持歌作樂為持解愁思明下童曲走馬上前阪石子彈馬蹄不惜彈馬蹄但惜馬上兒陳孔驕赭白陸郎乘班騅徘徊射堂頭望門不欲歸同生曲人生不滿百常懷千載憂早知人命促秉燭夜行遊歲月如流邁行已及素秋蟋蟀鳴空堂感悵令人憂江陵女歌古辭雨從天上落水從橋下流拾得娘裙帶同心結兩頭古樂府卷六
