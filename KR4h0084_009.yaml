  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4h0084_WYG_009-1a, image: WYG1368/WYG1368-0526a.png}
body:
  text: 古樂府卷九元左克明撰琴曲歌辭唐書樂志曰琴禁也夏至之音隂氣初動禁物之淫心也世本曰琴神農所造廣雅曰伏羲造琴用五弦揚雄曰舜彈五絃之琴而天下化琴操云文王武王加二絃以合君臣之恩今稱二絃為文武絃是也自伏羲製作之後有瓠巴師襄伯牙子期皆善鼓琴而其曲有暢有操有引有弄其後西漢時有慶安世劉道彊趙飛燕皆以琴稱古有五曲曰鹿鳴伐檀騶虞鵲巢白駒九引曰烈女伯妃貞女思歸霹靂走馬箜篌琴引楚引十二操曰將歸猗蘭龜山越裳拘幽岐山履霜朝飛別鶴殘形水仙襄陵焉自是以後作者相繼而其義與所起略可考而知故不復備論思親操虞舜古今樂録曰舜游歷山見鳥飛思親而作此歌陟彼歷山兮崔嵬有鳥翔兮高飛瞻彼鳩兮徘徊河水洋洋兮淸泠深谷鳥鳴兮鶯鶯設罥張罝兮思我父母力耕日與月兮往如馳父母逺兮吾將安歸襄陵操夏禹一曰禹上㑹稽書曰湯湯洪水方割蕩蕩懷山襄陵浩浩滔天樂録曰禹治洪水上㑹稽山顧而作此歌琴集曰禹上㑹稽夏禹東巡狩所作也嗚呼洪水滔天下民愁悲上帝愈咨三過吾門不入父子道衰嗟嗟不欲煩下民箕子操殷箕子一曰箕子吟古今樂録曰紂時箕子佯狂痛宗廟之為墟乃作此歌後傳以為操嗟嗟紂為無道殺比干嗟重復嗟獨奈何漆身為厲被髮以佯狂今奈宗廟何天乎天哉欲負石自投河嗟復嗟奈社稷何拘幽操周文王一曰文王哀羑里琴操曰拘幽操文王拘於羑里而作也殷道溷溷浸濁煩兮朱紫相合不别分兮迷亂聲色信讒言兮炎炎之虐使我愆兮幽閉牢阱由其言兮遘我四人憂動勤兮文王操周文王琴操曰紂為無道諸侯皆歸文王其後有鳯凰㗸書於郊文王乃作此歌翼翼翺翔彼鳯凰兮㗸書來游以㑹昌兮瞻天案圖殷將亡兮蒼蒼之天始有萌兮五神連精合謀房兮興我之業來望羊兮克商操周武王一曰武王伐紂琴論曰克商操武王伐紂時制上告皇天兮可以行乎傷殷操宋微子尚書大傳曰微子將朝周過殷之故墟見麥秀之蔪蔪黍禾之油油也曰此故父母之國宗廟社稷之亡也志勤心悲欲哭則為朝周欲泣則近婦人推而廣之作雅聲即此操也亦謂之麥秀歌云麥秀蔪蔪兮禾黍油油彼狡童兮不我好仇採薇操殷伯夷琴集曰採薇操伯夷所作也亦曰晨游高舉登彼西山言採其薇以亂易暴不知其非神農虞夏忽焉沒兮我適安歸于嗟徂兮命之衰矣越裳操周公旦古今樂録曰越裳獻白雉周公作歌遂傳之為越裳操於戲嗟嗟非旦之力乃文王之德神鳯操周成王一曰鳯凰來儀古今樂録曰周成王時鳯凰翔舞成王作此歌鳯凰翔兮於紫廷豫何德兮以感靈賴先人兮恩澤臻于胥樂兮民以寧履霜操尹伯竒琴操曰履霜操尹吉甫之子伯奇所作也伯竒無罪為後母所讒而見逐乃集芰荷以為衣採楟花以為食晨朝履霜自傷見放於是援琴鼓之而作此操曲終投河而死履朝霜兮採晨寒考不明其心兮聽讒言孤恩別離兮摧肺肝何辜皇天兮遭斯愆痛沒不同兮恩有偏誰說顧兮知我寃猗蘭操魯孔子一曰幽蘭操琴操曰猗蘭操孔子所作孔子歷聘諸侯諸侯莫能任自衛返魯隱谷之中見香蘭獨茂喟然嘆曰蘭當為王者香今乃獨茂與衆草為伍乃止卓援琴鼓之自傷不逢時託辭於香蘭云習習谷風以隂以雨之子于歸逺送于野何彼蒼天不得其所逍遙九州無所定處時人暗蔽不知賢者年紀逝邁一身將老將歸操魯孔子一曰鄹操琴操曰將歸操孔子所作也孔叢子曰趙使聘夫子夫子聞鳴犢與竇犨之見殺也回輿而旋為操曰將歸史記世家曰孔子既不得用於衛將西見趙簡子至於河而聞竇鳴犢舜華之死臨河而嘆曰美哉水洋洋兮某之不濟此命也夫子貢曰何謂也孔子曰竇鳴犢舜華晉國之賢大夫也趙簡子未得志之時須此二人而後從政及其已得志殺之乃從政夫鳥獸之不義尚知辟之况乎某哉乃還息乎鄹鄉作為鄹操哀之翺翔于衛復我舊居從吾所好其樂只且龜山操魯孔子琴操曰龜山操孔子所作也季桓子受齊女樂孔子欲諫不得退而望魯龜山作此曲以喻季氏若龜山之蔽魯也豫欲望魯兮龜山蔽之手無斧柯奈龜山何雉朝飛操齊犢沭子古今注曰雉朝飛者犢沭子所作也齊宣王時處士泯宣年五十無妻出薪於野見雉雄雌相隨而飛意動心悲乃仰天而嘆曰大聖在上恩及草木鳥獸而我獨不獲因援琴而歌以明自傷雉朝飛兮鳴相和雌雄羣游於山阿我獨何命兮未有家時將莫兮可奈何嗟嗟莫兮可奈何別鶴操商陵牧子崔豹古今注曰别鶴操商陵牧子所作也娶妻五年而無子父兄將為之改娶妻聞之中夜起倚尸而悲嘯牧子聞之愴然而悲乃援琴而歌後人因為樂章焉將乖比翼兮隔天端山川悠逺兮路漫漫攬衾不寐兮食忘餐處女吟魯處女琴操曰處女吟魯處女所作也古今樂録曰魯處女見女貞木而作歌亦謂之女貞木歌菁菁茂木隱獨榮兮變化垂枝含蕤英兮修身養志建令名兮厥道不同善惡並兮屈身身獨去微淸兮懷忠見疑何貪生兮琴歌三首百里奚妻風俗通曰百里奚為秦相堂上樂作所賃浣婦自言知音因援琴撫絃而歌問之乃其故妻還為夫婦也亦謂之扊扅字說曰門關謂之扊扅或作剡移百里奚五羊皮憶别時烹伏雌炊扊扅今日富貴忘我為百里奚初娶我時五羊皮臨當相别時烹乳雞今適富貴忘我為百里奚百里奚毋巳死葬南溪墳以瓦覆以柴舂黃藜扼伏雞西入秦五羖皮今日富貴捐我為求凰操漢司馬相如琴集曰司馬相如客臨卭富人卓王孫有女文君新寡竊於壁問見之相如以琴心挑之為琴歌二章按漢書相如飲卓氏弄琴文君竊從戶窺心恱而好之及夜亡奔相如相如與馳歸成都後俱如臨卭是也鳯兮鳯兮歸故鄉遨遊四海求其凰時未遇兮無所將何悟今夕兮升斯堂有豔淑女在閨房室邇人遐毒我腸何緣交頸為鴛鴦胡頡頏兮共翺翔鳯兮鳯兮從我栖得托孳尾永為妃交情通體心和諧中夜相從知者誰雙翼俱起翻高飛無感我思使余悲采芝操漢四皓琴集曰采芝操四皓所作也古今樂録曰商山四皓隱居高祖聘之四皓不井仰天歎而作歌皓天嗟嗟深谷逶迤樹木莫莫高山崔嵬巖居穴處以為幄茵曄曄紫芝可以療饑唐虞往矣吾當安歸八公操淮南王安一曰淮南操古今樂録曰淮南王好道正月上辛八公來降王作此歌煌煌上天照下土兮知我好道公來下兮公將與豫生毛羽兮超騰靑雲蹈梁甫兮觀見瑶光過北斗兮馳乘風雲使玉女兮含精吐氣嚼芝草兮悠悠將將天相保兮思歸引晉石崇舊說衛有賢女邵王聞其賢請聘之未至而王薨太子曰吾聞齊桓公得衛女而霸今衛女賢欲留之大夫曰不可若賢女必不我聽若聽必不賢不賢不可取也太子遂留之果不聽拘於深宫思歸不得援琴而歌曲終自縊而死晉石崇亦有思歸引但思歸河陽所居若劉孝威胡地憑良馬備言思歸之狀而已思歸引歸河陽假余翼鴻鶴高飛翔經芒阜濟河梁望我舊館心恱康淸渠激魚倣徨鴈驚泝波羣相將終日周覽樂無方登雲閣列姬姜拊絲竹叩宫商宴華池酌玉觴劉孝威胡地憑良馬懷驕負漢恩井泉烽火入回中宫室燔錦車勞逺駕繡衣疲屢奔二師巳喪律都尉亦銷魂龍堆求援急狐塞請先屯櫪下驅雙駿腰邉帶兩鞬乘障無期限思歸安可論一作言走馬引張率一曰天馬引崔豹古今注曰走馬引樗里牧恭所作也為父報怨殺人而亡匿於山之下有天馬夜降圍其室而鳴覺聞其聲以為追吏奔而亡去明旦視之乃天馬跡也因愓然大悟曰豈吾所處之將危乎遂荷糧而逃入于沂澤中援琴而鼓之為天馬之聲故曰走馬引良馬龍為友玉珂金作羈馳騖一作相去宛與洛半驟復半馳倐忽而千里光景不及移几方惜未見薛公寧所知斂轡且歸去吾畏路傍兒荆軻歌陽縉陳陽縉作荆軻歌後人傳以為琴中曲亦曰渡易水事載首集函谷路不通燕將重深功長虹貫白日易水急寒風壯髮危冠下七首地圖中琴聲不可識遺恨沒秦宫琴歌二首趙整晋書曰苻堅末年怠於為政趙整援琴作歌二章以諷之昔聞盟津河千里作一曲此水本自淸是誰亂使濁北園有棗樹布葉垂重隂外雖多棘刺內實有赤心晋書載記曰苻堅分氐户於諸鎮趙整因侍援琴而歌堅笑而不納及敗於姚萇果如整言阿得脂阿得脂博勞舊父是仇綏尾長翼短不能飛逺徙種人留鮮卑一旦緩急語阿誰徐孝嗣風閨晚翻靄月殿夜凝明願君早留眄無令春草生梁吳均別鶴尋故侣聯翩遼海間單栖孟津水驚唳隴頭山古樂府卷九
