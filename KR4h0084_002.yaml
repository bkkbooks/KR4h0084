body:
  text: 古樂府卷二元左克明撰鼓吹曲歌辭鼓吹曲一曰短簫鐃歌劉瓛定軍禮云鼓吹未知其始或曰黃帝岐伯所作以建威揚德風勸敵士蔡雍禮樂志曰漢樂四品其四曰短簫鐃歌軍樂也建初伎録云列于殿庭者名鼓吹按孫權觀魏武帝軍作鼓吹而還此應是今之鼓吹晉中興書曰漢武帝時南越加置七郡皆假鼓吹班超拜長史假鼓吹麾幢則短簫鐃歌漢時已名鼓吹不自魏晉始也西京雜記漢大駕祠井泉汾隂備千乘萬騎有黃門前後部鼓吹則不獨列于殿庭者名鼓吹也古今注曰漢樂有黃門鼓吹而短簫鐃歌鼓吹之一章爾然則黃門鼓吹短簫鐃歌與橫吹曲得通名鼓吹但所用異爾漢有二十二曲列于鼓吹謂之鐃歌而存者十八篇曰朱鷺思悲翁艾如張上之回擁離戰城南巫山髙上陵將進酒君馬黃芳樹有所思雉子班聖人出上邪臨髙臺逺如期石流而務成玄雲黃雀釣竿四篇其辭已亡魏文帝受命使繆襲改造十二曲曰楚之平戰滎陽獲吕布克官渡舊邦定武功屠柳城平南荆平關中應帝期雍熙大和吳亦令韋昭改製十二曲曰炎精缺漢之季攄武師伐烏林秋風克皖城關背德通荆門章洪德從厯數承天命玄化而君馬黃雉子班聖人出臨髙臺逺如期石流務成玄雲黃雀釣竿十曲並仍其舊名晉武帝受禪命傳元製二十二曲曰靈之祥宣受命征遼東宣輔政時運多難景龍飛平玉衡文皇統百揆因時運惟庸蜀天序大晉承運期金靈運於穆我皇仲春振旅夏苗田仲秋獮田順天道唐堯玄雲伯益釣竿而玄雲釣竿名不改舊宋何承天於義熙末年秋製十五篇皆擬漢舊名大抵别增新意其義與古辭不合疑未嘗被於歌聲也如齊王融謝朓梁昭明太子統范雲陳蘇子卿等追擬古題立義不同今取其一二立于篇次以便觀覽云鐃歌朱鷺漢古辭此蓋因飾鼓以鷺而名曲焉魏繆襲改朱鷺為楚之平吳韋昭改為炎精缺言漢室衰孫堅奮迅猛志念在匡救王迹也晉傳玄改為靈之祥言宣皇帝之佐魏猶虞舜之事堯也既有石瑞之徵又能用武以誅孟度之逆命也宋何承天朱鷺篇曰朱鷺揚和鸞翠蓋耀金華但稱路車之美與漢曲異朱鷺魚以烏路訾邪鷺何食食茄下不之食不以吐將以問誅一作諫者楚之平一作初之乎魏繆襲楚之平義兵征神武奮金鼓鳴邁武德揚洪名漢室微社稷傾皇道失桓與靈閹官熾羣雄爭邉韓起亂金城中國擾無紀經赫武皇起旗旌麾天下天下平濟九州九州寧創武功武功成越五帝邈三王興禮樂定紀綱普日月齊輝光炎精缺吳韋昭炎精缺漢道微皇綱弛政德違衆姦熾民罔依赫武烈越龍飛陟天衢耀靈威鳴雷鼓抗電麾撫乾衡鎮地機厲虎旅騁熊羆發神聽吐英竒張角破邉韓羈宛潁平南土綏神武章渥澤施金聲震仁風馳顯髙門啓皇基統罔極垂將來靈之祥晉傅玄靈之祥石瑞章旌金德出西方天降命授宣皇應期運時龍驤繼大舜佐陶唐讚文武建帝綱孟氏叛據南疆追有扈亂五常吳寇徑蜀虜疆交誓盟連遐荒宣赫怒奮鷹揚震乾威曜電光陵九天陷石城梟逆命拯有生萬國安四海寧朱路篇宋何承天朱路揚和鸞翠蓋耀金華玄牡飾樊纓流旌拂飛霞雄戟闢曠塗班劍翼髙車三軍且莫喧聽我奏鐃歌清鞞驚短簫朗鼓節鳴笳人心惟愷豫兹音亮且和輕風起紅塵渟瀾發微波逸韻騰天路穨響結城阿仁聲被八表威靈振九遐嗟嗟介胄士朂哉念皇家思悲翁漢古辭此漢古辭魏改為戰滎陽言曹公也吳改為漢之季言孫堅悼歎漢之微痛董卓之亂興兵奮擊功蓋海內也晉曰宣受命言宣皇帝禦諸葛亮養威重運神兵亮震怖死也宋何承天以為思悲公篇思悲翁唐思奪我美人侵以遇悲翁也但我思蓬首一作蕞狗逐狡兔食交君梟子五梟母六拉沓髙飛暮安宿戰滎陽魏繆襲戰滎陽汴水陂戎士憤怒貫甲馳陳未成退徐滎二萬騎塹壘平戎馬傷六軍驚勢不集衆幾傾白日沒時晦冥顧中牟心屏營同盟疑計無成賴我武皇萬國寧漢之季吳韋昭漢之季董卓亂桓桓武烈應時運義兵興雲旗建厲六師羅八陳飛鳴鏑接白刃輕騎發介士奮醜虜震使衆散劫漢主遷西館雄豪怒元惡僨赫赫皇祖功名聞宣受命晉傳玄宣受命應天機風雲時動神龍飛禦諸葛鎮雍梁邉境定夷夏康務節事勤定傾攬英雄保持盈淵穆穆赫明明沖而泰天之經養威重運神兵亮乃震斃一作死天下寧思悲公篇何承天思悲公懷衮衣東國何悲公西歸公西歸流二叔幼主既悟偃禾復偃禾復聖志申營都新邑從斯民從斯民德惟明制禮作樂興頌聲興頌聲致嘉祥鳴鳳爰集萬國康萬國康猶弗已握髮吐餐下羣士惟我君繼伊周親覩盛世復何求艾如張漢古辭古辭曰艾而張羅又曰雀以髙飛奈雀何穀梁傳艾蘭以為防置旃以為轅門謂因搜狩以習武事也魏改為獲吕布言曹公東圍臨淮生擒吕布也吳曰攄武師言孫權卒父之業而征伐也晉曰征遼東言宣皇帝臨大海之表討滅公孫淵而梟其首也蘇子卿云張機蓬艾側宋古詞曰幾令吾呼厯舍俱失古題夲意聲相傳訓詁不可復解但俱失古題本意艾而張羅夷於何行成之四時和山出黃雀亦有羅雀以髙飛奈雀何為此倚欲誰肯礞室獲吕布魏繆襲獲吕布戮陳宫芟夷鯨鯢驅騁羣雄囊括天下運掌中攄武師吳韋昭攄武師斬黃祖㩋夷凶族革平西夏炎炎大烈震天下征遼東晉傅玄征遼東敵失據威靈邁日域公孫既授首羣逆破膽咸震怖朔北響應海表景附武功赫赫德雲布擬題陳蘇子卿誰在間門外羅家諸少年張機蓬艾側結網槿籬邉若能飛自免豈為繒所纒黃雀倘為誡朱絲猶可延宋古辭幾令吾呼厯舍居執來隨咄武子邪令烏銜針相風其右其右一解幾令吾呼羣議破葫執來隨吾咄武子邪令烏今烏今􅠱入海相風及後二解幾令吾呼無公赫吾執來隨吾咄武子邪令烏無公赫吾婮立諸布始布三解上之回漢古辭漢武帝元封初因至雍遂通回中道後數遊幸焉其歌稱帝遊石關望諸國月支臣丐奴服皆美當時事也魏改為克官渡言曹公與袁紹戰破之於官渡也吳曰伐烏林言魏武既破荆州順流東下欲來爭鋒孫權命將周瑜逆擊之於烏林而走破也晉曰宣輔政言宣皇帝聖道深逺撥亂反正網羅文武之才以定二儀之序也上之回所中益夏將至行將北以承甘泉宫寒暑德遊石關望諸國月支臣丐奴服令從百官疾驅馳千秋萬嵗樂無極克官渡魏繆襲克紹官渡由白馬僵尸流血被原野賊衆如犬羊王師尚寡沙塠傍風飛揚轉戰不利士卒傷今日不勝後何望土山地道不可當卒勝大捷震冀方屠城破邑神武遂章伐烏林吳韋昭曹操北伐拔柳城乘勝席捲遂南征劉氏不睦八郡震驚衆既降操屠荆舟車十萬揚風聲議者狐疑慮無成賴我大皇發聖明虎臣雄烈周與程破操烏林顯章功名宣輔政晉傅玄宣皇輔政聖烈深撥亂反正從天心網羅文武才慎厥所生所生賢遺教施安上治民化風移肇創帝基洪業垂於鑠明明時赫戲功濟萬世定二儀雲澤雨施海外風馳翁離漢古辭一作雍離一作擁離魏改曰舊邦言曹公勝袁紹於官渡還譙收藏死亡士卒也吳曰秋風言孫權悅以使民民忘其死也晉曰時運多難言宣皇致討吳方有征無戰也何承天云雍士離心義稍異擁離趾中可築室何用葺之蕙用蘭擁離趾中舊邦魏繆襲舊邦蕭條心傷悲孤魂翩翩當何依遊士戀故涕如摧兵起事大令願違傳求親戚在者誰立廟置後魂來歸一曰魂來求歸秋風吳韋昭秋風揚沙塵寒露沾衣裳角弓持弦急鳩鳥化為應邉垂飛羽檄寇賊侵界疆跨馬披甲胄慷慨懷悲傷辭親向長路安知存與亡窮達固有分志士思立功思立功邀之戰場身逸獲髙賞身沒有遺封時運多難晉傅玄時運多難道教痡天地變化有盈虛蠢爾吳蠻虎視江湖我皇赫斯致天誅有征無戰弭其圖天威橫被廓東隅雍離篇何承天雍士多離心荆民懷怨情二凶不量德搆難稱其兵王人銜朝命正辭糾不庭上宰宣九伐萬里舉長旌樓船掩江濆駟介飛重英歸德戒後夫賈勇尚先鳴逆徒既不濟愚智亦相傾霜鋒未及染鄢郢忽已清西川無潛鱗北渚有奔鯨凌威致天府一戰夷三城江漢被美化宇宙歌太平惟我東郡民曾是深推誠戰城南漢古辭其詞大略言戰城南死郭北野死不葬為烏鳥所食願為忠臣朝出攻戰而暮不得歸也魏改為定武功言曹公初破鄴武功之定始乎此也吳曰克皖城言魏武志圖并兼而令朱光為廬江太守孫權親征光破之於皖城也晉曰景龍飛言景帝克明威教賞從夷逆祚隆無疆崇此洪基也宋何承天擬題以為士卒勇於赴敵而有成功也戰城南死郭北野死不葬烏可食為我謂烏且為客豪野死諒不葬腐肉安能去子逃水深激激蒲葦冥冥梟騎戰鬬死駑馬徘徊鳴梁築室何以南梁何北禾黍不穫君何食願為忠臣安可得思子良臣良臣誠可思朝行出攻暮不夜歸定武功魏繆襲定武功濟黃河河水湯湯旦暮有橫流波袁氏欲衰兄弟尋干戈決漳水水流滂沱嗟城中如流魚誰能復顧室家計窮慮盡求來連和和不時心中憂戚賊衆內潰君臣奔北拔鄴城奄有魏國王業艱難覽觀古今可為長嘆克皖城吳韋昭克滅皖城遏冦賊惡此凶孽阻姦慝王師赫征衆傾覆除穢去暴戢兵革民得就農邊境息誅君弔民昭至德景龍飛晉傅玄景龍飛御天威聰鑒玄察動與神明協機從之者顯逆之者滅夷文教敷武功巍普被四海萬邦望風莫不來綏聖德潛斷先天弗違弗違祥享世永長猛以致寬道化光赫明明祚隆無疆帝績惟期有命既集崇此洪基戰城南篇何承天戰城南衝黃塵丹旌電烻鼓雷震勍敵猛戎馬殷橫陳亘野若屯雲仗大順應三靈義之所感士忘生長劍擊繁弱鳴飛鏑炫晃亂奔星虎騎躍華眊旋朱火延起騰飛煙驍雄斬髙旗搴長角浮呌響清天夷羣冦殪逆徒餘黎霑惠詠來蘇奏愷樂歸皇都班爵獻俘邦國娛巫山髙漢古辭古詞大略言江淮水深無梁可度臨水逺望思歸而已魏改為屠栁城言曹公越北塞厯白檀破三郡烏桓於栁城也吳曰關背德言蜀將關羽背棄吳德心懷不軌孫權引師浮江而擒之也晉曰平玉衡言景帝一萬國之殊風齊四海之乖心禮賢養士而纂洪業也宋何承天以李氏恃險為晉所滅也若齊王融想像巫山髙梁范雲巫山髙不極雜以陽臺神女之事無復逺道望歸之思也巫山髙髙以大淮水深難以逝我欲東歸害梁不為我集無髙曳水何梁湯湯回回臨水逺望泣下沾衣逺道之人心思歸謂之何屠栁城魏繆襲屠栁城功誠難越度隴塞路漫漫北踰岡平但聞悲風正酸踏頓授首遂登白狼山神武慹海外永無北顧患關背德吳韋昭關背德作鴟張割我邑城圖不祥稱兵北伐圍樊襄陽嗟臂大於股將受其殃巍巍夫聖主睿德與玄通與玄通親任吕蒙泛舟洪汜池溯涉長江神武一何桓桓聲烈正與風翔厯撫江安城大據郢邦虜羽授首百蠻咸來同盛哉無比隆平玉衡晉傅玄平玉衡糾姦回萬國殊風四海乖禮賢養士羇御英雄思心齊纂戎洪業崇皇階品物咸亨聖敬日躋聰鑒盡下情明明綜天機巫山髙篇何承天巫山髙三峽峻青壁千尋深谷萬仭崇巖冠靈林冥冥山禽夜響晨猿相和鳴洪波迅澓載逝載停悽悽商旅之客懷苦情在昔陽九皇綱微李氏竊命宣武耀靈威蠢爾逆縱復踐亂機王旅薄伐傅首來至京師古之為國惟德是貴力戰而虐民鮮不顛墜矧乃叛戾伊胡能遂咨爾巴子無放肆王融想像一作髣佛巫山髙薄暮陽臺曲煙雲乍舒卷猿鳥時斷續一作煙華乍卷舒行芳時斷續彼美如可期寤言紛在矚憮然坐相望秋風下庭緑范雲巫山髙不極白日隱光輝靄靄朝雲去溟溟暮雨歸巖懸獸無迹林暗鳥疑飛枕席竟誰薦相望空依依上陵漢古辭古今樂録曰漢章帝元和中有宗廟食舉共六曲加重來上陵二曲為上陵食舉後漢書禮儀志曰正月上丁祠南郊次北郊明堂髙廟世祖廟謂之五供禮畢以次上陵西都舊有上陵東都之儀太官上食太常樂奏食舉按古詞大略言神仙事不知與食舉曲同否魏改曰平南荆言曹公南平荆州也吳曰通荆門言孫權與蜀交好齊盟中有關羽自失之愆戎蠻樂亂生變作患蜀疑其眩吳惡其詐乃大治兵終復初好也晉曰文皇統百揆言文皇帝始統百揆用人有序以敷太平之化也宋何承天曰上陵者相追攀但言升髙望逺傷時怨歎而已上陵何美美下津風以寒問客從何來言從水中央桂樹為君船青絲為君笮木蘭為君棹黃金錯其間滄海之雀赤翅鴻白雁隨山林乍開乍合曾不知日月明醴泉之水光澤何蔚蔚芝為車龍為馬覽遨遊四海外甘露初二年芝生銅池中仙人下來飲延夀千萬歲平南荆魏繆襲南荆何遼遼江漢濁不清菁茅久不貢王師赫南征劉琮據襄陽賊備屯樊城六軍廬新野金鼓震天庭劉子面縛至武皇許其成許其成撫其民陶陶江漢間普為大魏臣大魏臣向風思自新思自新齊功古人在昔虞與唐大魏得與均多選忠義士為喉脣天下一定萬世無風塵通荆門吳韋昭荆門限巫山髙峻與雲連蠻夷阻其險厯世懷不賔漢王據蜀郡崇好結和親乖微中情疑讒夫亂其間大皇赫斯怒虎臣勇氣震蕩滌幽藪討不恭觀兵揚炎耀厲鋒整封疆整封疆闡揚威武容功赫戲洪烈炳章邈矣帝皇世聖吳同厥風荒裔望清化化恢𢎞煌煌大吳延祚永未央文皇統百揆晉傅玄文皇統百揆繼天理萬方武將鎮四隅英佐盈朝堂謀言協秋蘭清風發其芳洪澤所漸潤礫石為圭璋大道侔五帝盛德踰三王咸光大上參天與地至化無內外無內外六合並康乂並康乂遘兹嘉會在昔羲與農大晉德斯邁鎮征及諸州為蕃衛玄功濟四海洪烈流萬世上陵者篇何承天上陵者相追攀被服纖麗振綺紈擕童幼升崇巒南望城闕鬱盤桓王公第通衢端髙甍華屋列朱軒臨濬谷掇秋蘭士女悠奕映隰原指營丘感牛山爽鳩既沒景君歎嗟歲聿逝不還志氣衰沮玄鬢斑野莽宿墳土乾顧此纍纍中心酸生必死亦何怨取樂今日展情歡將進酒漢古辭古詞曰將進酒乘太白大略以飲酒放歌為言魏改為平關中言曹公征馬超定關中也吳曰章洪德言孫權章其大德而逺方來附也晉曰因時運言文皇帝因時運變聖謀潛施解長蛇之交離羣桀之黨以武濟文審其大計以邁其德也宋何承天曰將進酒慶三朝備繁禮薦嘉肴則言朝會進酒且以濡首荒志為戒若梁昭明太子云洛陽輕薄子但敘遊樂飲酒而已將進酒乘太白辨佳哉詩審搏放故歌心所作同隂氣詩悉索使禹良工觀者苦平關中魏繆襲平關中路向潼濟濁水立髙墉鬬韓馬離羣凶選驍騎縱兩翼虜崩潰級萬億章洪德吳韋昭章洪德邁威神感殊風懷逺鄰平南裔齊海濵越裳貢扶南臣珍貨充庭所見日新因時運晉傅玄因時運聖策施長蛇交解羣桀離勢窮奔吳虎騎厲惟武進審大計時邁其德清一世將進酒篇何承天將進酒慶三朝備繁禮薦嘉肴榮枯換霜霧交緩春帶命朋僚車等旗馬齊鑣懷溫克樂林濠士失志愠情勞思旨酒寄遊遨敗德人甘醇醪耽長夜或淫妖興屢舞厲哇謡形傞傞聲號呶首既濡志亦荒性命夭國家亡嗟後生節酣觴匪酒辜孰為殃梁昭明太子洛陽輕薄子長安遊俠兒宜城溢渠碗中山浮羽巵君馬黃漢古辭初言君馬黃臣馬蒼二馬同逐臣馬良終言美人歸以南歸以北駕車馳馬令我心傷而晉改為金靈運則言聖皇踐祚致敬宗廟而孝行於天下也而宋何承天止言馬而已君馬黃臣馬蒼二馬同逐臣馬良易之有騩蔡有赭美人歸以南駕車馳馬美人傷我心佳人歸以北駕車馳馬佳人安終極金靈運晉傅玄金靈運天符發聖徵見參日月惟我皇體神聖受魏禪應天命皇之興靈有徵登天麓御萬乘皇之輔若闞虎爪牙奮莫之禦皇之佐讚清化百事理萬邦賀神祗應嘉瑞章恭享禮薦先皇樂時奏磬管鏘鼓淵淵鍾鍠鍠奠樽俎實玉觴神歆饗咸悅康宴孫子祐無疆大孝蒸蒸德教被萬方君馬篇何承天君馬麗且間揚鑣騰逸姿駿足躡流景髙步追輕飛冉冉六轡柔奕奕金華暉輕霄羽翼蓋長風靡淑旗願為范氏驅雍容步中畿豈效詭遇子馳騁趣危機鉛陵策良駟造父為之悲不怨吳坂峻但恨伯樂稀赦彼岐山盜實濟韓原師奈何漢魏主縱情營所私疲民甘藜藿廏馬患盈肥人畜眢厥養蒼生將焉歸芳樹漢古辭古詞云妒人之子愁殺人君有他心樂不可禁魏改曰雍熙言魏氏臨其國君臣雍穆庶績咸熙也吳曰承天命言上以聖德踐位道化至盛也晉曰天序言聖皇應厯受禪𢎞濟大化用人各盡其才也何承天擬題止言芳樹而佳人之傷時而已若王融相思早春日謝朓早玩華池隂但言時莫衆芳歇絶而已芳樹日月君亂如於風芳樹不上無心溫而鵠三而為行臨蘭池心中懷我悵心不可匡目不可顧妒人之子愁殺人君有他心樂不可禁王將何侣如孫如魚乎悲矣雍熙魏繆襲雍熙君臣念德天下治登帝道獲瑞寶頌聲並作洋洋浩浩吉日臨髙堂置酒列名倡歌聲一何紆餘雜笙簧八音諧有紀綱子孫永建萬國夀考樂無央承天命吳韋昭承天命於昭聖德三精垂象符靈表德巨石立九穗植龍金其鱗烏赤其色輿人歌億夫歎息超龍升襲帝服窮淳懿體玄默夙興臨朝勞謙日昃易簡以崇仁放逺讒與慝舉賢才親近有德均田疇茂稼穡審法令定品式考功能用黜陟人思自盡唯心與力家國治王道直思我帝皇夀萬億長保天祿祚無極天序晉傅玄天序厯應受禪承靈祜御羣龍勒螭虎𢎞濟大化英俊作輔明明統萬機赫赫鎮四方咎繇稷契之疇協蘭芳禮王臣覆兆民化之如天與地誰敢愛其身芳樹篇何承天芳樹生北庭豐隆正徘徊翠穎陵冬秀紅葩迎春開佳人間幽室惠心婉以諧蘭房掩綺幌緑草被長階日夕遊雲際歸禽命同棲皓月盈素景涼風拂中閨哀絃理虛堂要妙清且悽嘯歌流激楚傷此碩人懷梁塵集丹帷微飇揚羅鞋豈怨嘉時暮徒惜良願乖王融相望早春日煙華雜如霧復此佳麗人含情結芳樹綺羅已自憐萱風多有趣去來徘徊者佳人不可遇謝朓早玩華池隂復影滄洲枻旑旎芳若斯葳蕤紛可結霜下桂枝鋪怨與飛蓬折不厠玉盤滋誰憐終委絶有所思漢古辭其詞大略言有所思乃在大海南何用問遺君雙珠玳瑁簪聞君有他心燒之當風揚其灰魏改曰應帝期言文帝以聖德受命應運期也吳曰從厯數言孫權從圖籙之符而建大號晉曰惟庸蜀言文皇帝既平萬乘之蜀封建萬國復五等之爵宋何承天惟言孝養若王融如何有所思梁劉繪别離安可再但言離思而巳有所思乃在大海南何用問遺君雙珠玳瑁簪用玉紹繚之聞君有他心拉雜摧燒之摧燒之當風揚其灰從今已往勿復相思相思與君絶雞鳴狗吠兄嫂當知之妃呼豨秋風肅肅晨風颸東方須臾髙知之應帝期魏繆襲應帝期於昭我文皇厯數承天序龍飛自許昌聰明昭四表恩德動遐方星辰為垂耀日月為重光河洛吐符瑞草木挺嘉祥麒麟步郊野黃龍遊津梁白虎依山林鳳凰鳴髙岡考圖定篇籍功配上古羲皇羲皇無遺文仁聖相因循期運三千歲一生聖明君堯授舜萬國萬國皆附親四門為穆穆教化常如神大魏興盛與之為鄰從厯數吳韋昭從厯數於穆我皇帝聖哲受之天神明表竒異建號創皇基聰睿協神思德澤浸及昆蟲浩蕩越前代三光顯精耀隂陽稱至治肉角步郊畛鳳凰棲靈囿神龜遊沼池圖讖摹文字黃龍覿鱗符祥日月記覽往以察今我皇多繪事上欽昊天象下副萬姓意光被彌蒼生家户蒙惠賚風教肅以平頌聲章嘉喜大吳隆綽有餘裕惟庸蜀晉傅玄惟庸蜀僭號天一隅劉備逆帝命禪亮承其餘擁衆數十萬窺隙乘我虛驛騎進羽檄天下不遑居薑維屢寇邊隴上為荒蕪文皇愍斯民厯世受罪辜外謨藩屏臣內謀衆士夫爪牙應指授腹心獻一作同良圖良圖協成文大一作乃興百萬軍雷鼓震地起猛勢陵浮雲逋虜畏天誅面縛造壘門萬里同風教逆命稱妾臣光建五等紀綱天人有所思篇宋何承天有所思思昔人曾閔二子善養親和顔色奉晨昏至誠蒸蒸通神明鄒孟軻為齊卿稱身受祿不貪榮道不用獨擁楹三徙既誶禮義明飛鳥集猛獸附功成事畢乃更娶哀我生遘凶旻幼罹荼酷備艱辛慈顏絶見無因長懷永思託邱墳王融如何有所思而無相見時宿昔夢顏色階庭尋履綦髙張更何已引滿終自持欲知憂能老為視鏡中絲劉繪别離安可再而我更重之佳人不相見明月空在帷共銜滿堂酌獨斂向隅眉中心亂如雪寧知有所思雉子班漢古辭古詞云雉子髙飛止黃鵠飛之以千里雄來飛從雌晉改曰於穆我皇言聖皇受命德合神明也宋何承天曰雉子遊原澤篇則言避世之士抗志清霄其視卿相功名猶冰炭之不相入也雉子班如此之干雉梁無以吾翁孺雉子知得雉子髙飛止黃鵠飛之以千里王可思雄來飛從雌視子趨一雉雉子車大駕馬滕被王送行所中堯羊蜚從王孫行於穆我皇晉傅玄於穆我皇盛德聖且明受禪君世光濟羣生普天率土莫不來庭顒顒六合內望風仰泰清萬國雍雍興頌聲大化洽地平而天成七政齊五衡惟平峨峨佐命濟濟羣英夙夜乾乾萬幾是經雖治興匪荒寧謙道光沖不盈天地合德日月同榮赫赫煌煌曜幽冥三光克從於顯天垂景星龍鳳臻甘露宵零肅神祗祇上靈萬物欣載自天效其成雉子遊原澤篇何承天雉子遊原澤幼懷耿介心飲啄雖勤苦不願棲園林古有避世士抗志清霄岑浩然寄卜肆揮棹通川隂逍遙風塵外散髮撫鳴琴卿相非所眄何况於千金功名豈不美寵辱亦相尋冰炭結六府憂虞纒胸襟當世須大度量巳不克任三復泉流誡自驚良已深聖人出漢古辭漢古辭言聖人出隂陽和君之臣明護不道晉曰仲春振旅言大晉申文武之教畋獵以時也聖人出隂陽和美人出遊九河佳人來騑離哉何駕六飛龍四時和君之臣明護不道美人哉宜天子免甘星筮樂甫始美人子含四海仲春振旅晉傅玄古聖人出行仲春振旅大致民武教於時日新師執提工執鼓坐作從節有序盛矣允文允武搜田表禡申法誓遂圍禁獻社祭允以時明國制文武並用禮之經列車如戰大教明古今誰能去兵大晉繼天濟羣生上邪漢古辭邪一作雅上邪我欲與君相知長命無絶衰山無陵江水為竭冬雷震震夏雨雪天地合乃敢與君絶太和魏繆襲晉書樂志曰魏武帝使繆襲造鼓吹十二曲以代漢曲改漢上邪為太和言明帝繼體承統太和改元德澤流布也惟太和元年皇帝踐阼聖且仁德澤為流布災蝗一時為絶息上天時雨露五穀溢田疇四民相率遵軌度事務徵清天下獄訟察以情元首明魏家如此那得不太平玄化吳韋昭玄化象以天陛下聖真張皇綱率道以安民惠澤宣流而雲布上下睦親君臣酣宴樂激發弦歌揚妙新修文籌廟勝須時備駕巡洛津康哉泰四海歡欣越與三五鄰大晉承運期晉傅玄大晉承運期德隆聖皇時清晏白日垂光應籙圖陟帝位繼天正玉衡化行象神明至哉道隆虞與唐元首敷洪化百寮股肱並忠良時太康隆隆赫赫福祚盈無疆上邪篇何承天上邪下難正衆枉不可矯音和響必清端影緣直表大化揚仁風齊人猶偃草聖王既已沒誰能𢎞至道開春湛柔露代終肅嚴霜承平貴孔孟政弊侯申商孝公明賞罰六世猶克昌李斯肆濫刑秦民所以亡漢宣隆中興魏祖寧三方譬彼針與石效疾而稱良行葦非不厚悠悠何詎央琴瑟時未調改弦當更張矧乃治天下此要安可忘臨髙臺漢古辭漢古詞大略言臨髙臺臺下水清且寒江有香草目以蘭黃鵠髙飛離哉翻關弓射鵠令我主萬年晉曰夏苗田言大晉畋狩順時為苗除害也何承天云飄然輕舉凌太虛言仙道也謝朓云千里常思歸但言臨望傷懷與古詞意並不同臨髙臺以軒下下有清水清且寒江有香草目以蘭黃鵠髙飛離哉翻關弓射鵠令我主夀萬年收中吾夏苗田晉傅玄夏苗田運將徂軍國異容文武殊乃命羣吏撰車徒辨其號名讚契書王軍啓八門行同上帝居時路建大麾雲旗翳紫虛百官象其事疾則疾徐則徐回衡旋軫罷陳弊車獻禽享祠蒸蒸配有虞惟大晉德參兩儀化雲敷臨髙臺篇何承天臨髙臺望天衢飄然輕舉陵太虛擕列子超帝鄉雲衣雨帶乘風翔肅龍駕會瑤臺清暉浮景溢蓬萊濟西海濯洧盤佇立雲嶽結幽蘭馳迅風遊炎州願言桑梓思舊遊傾霄蓋靡電旌降彼天塗頽窈冥辭仙族歸人羣懷忠抱義奉明君任窮達隨所遭何為逺想令心勞謝朓千里常思歸登臺臨綺翼才見孤鳥還未辨連山極四面動清風朝夜起寒色誰知倦遊者嗟此故鄉憶逺如期漢古辭一曰逺期宋書樂志有晚芝曲古今樂録曰漢太樂食舉曲有逺期至魏省之晉曰仲秋獮田言大晉雖有文德不廢武事順時以殺伐也宋何承天云逺期千里客肅駕候良辰與古辭不同矣逺如期益如夀處天左側大樂萬歲與天無極雅樂陳佳哉紛單于自歸動如驚心虞心大佳萬人還來謁者引鄉殿陳纍世未嘗聞之增夀萬年亦誠哉仲秋獮田晉傅玄仲秋獮田金德常剛涼風清且厲凝露結為霜白藏司辰蒼隼時鷹揚鷹揚猶尚父順天以殺伐春秋時敘雷霆震威曜進退由鉦鼓致禽祀祊羽毛之用充軍府赫赫大晉德芬烈陵三五敷化以文雖安不廢武光宅四海永享天之祜逺期篇何承天逺期千里客肅駕候良辰近命城郭友具邇惟懿親髙門啓雙闈長筵列佳賔中堂舞六佾三廂羅樂人簫管激悲音羽毛揚華文金石響髙宇絃歌動梁塵修標多巧捷九劍亦入神遷善自雅調成化由清均主人垂隆慶羣士樂亡身願我聖明君邇期保萬春石流漢古辭古辭不可讀晉曰順天道言仲冬大閲用武修文大晉之德配天也何承天云石上流水湔湔其波又言子在川上有志不遂立義不同石流涼陽涼石水流為沙錫以微河為香向始􅀈冷將風陽北逝肯無敢與于楊心邪懷蘭志金安薄北方開留離藂蘭順天道晉傅玄順天道握神契三時示講武事冬大閲鳴鐲振鼓鐸旌旗象虹霓文制其中武不窮武動軍誓衆禮成而義舉三驅役崇仁進止不失其序兵卒練將如闞虎惟闞虎氣凌青雲解圍三面殺不殄羣偃旌麾班六軍獻享蒸修典文嘉大晉德配天祿報功爵候賢饗燕樂受兹百祿嘉萬年石流篇何承天石上流水湔湔其波發源幽岫永歸長河瞻彼逝者歲月其偕子在川上惟以增懷嗟我隱憂載勞寤寐遘此百罹有志不遂行年倐忽長勤是嬰永言沒世悼兹無成幸遇開泰沐浴嘉運緩帶安寢亦又何愠古之為仁自求諸巳虛情遙慕終於徒已唐堯漢務成古詞已亡晉曰唐堯言聖皇陟帝立德化光四表也唐堯咨務成謙謙德所興積漸終光大履霜至堅冰神明道自然河海猶可凝舜禹統百揆元凱以次升禪讓應天厯睿聖世相承我皇陟帝位平衡正凖繩德化飛四表祥氣見其徵興王坐俟旦亡主恬自矜致逺由近始覆簣成山陵披圖按先籍有其證靈液玄雲晉傅玄漢古辭亡晉依舊名言聖皇用人各盡其材也玄雲起丘山祥氣萬里會龍飛何蜿蜿鳳翔何翽翽昔在唐虞朝時見青雲際今親遊萬國流光溢天外鶴鳴在後園清音隨風邁成湯隆顯命伊摯來如飛周文獵渭濵遂載吕望歸符合如影響先天天弗違輟耕綜時綱解褐襟天維元功配二王芬􅀢世所稀我皇敘羣才洪烈何巍巍桓桓征四表濟濟理萬機神化感無方髦才盈帝畿丕顯惟昧旦日新孔所咨茂哉聖明德日月同光輝伯益晉傅玄漢黃爵古辭亡晉曰伯益言赤烏銜書有周以興今聖皇受命神雀來也伯益佐舜禹職掌山與川德侔十六相思心入無間智理周萬物下如衆烏言黃雀應清化翔集何翩翩和鳴棲庭樹徘徊雲日間夏桀為無道密網施山河酷祝振纖網當奈黃雀何殷湯崇天德去其三面羅逍遙羣飛來鳴聲乃復和朱雀作南宿鳳凰統羽羣赤烏銜書至天命瑞周文神雀今來遊為我受命君嘉祥致天和膏澤降青雲蘭風發芳氣闔世同其芬釣竿歌魏文帝舊説有伯常子避仇河濵為漁者其妻思之而為釣竿歌每至河側輒歌之後司馬相如作釣竿詩遂傳以為樂曲而漢古辭亡或云漢止草一曲而無釣竿此篇魏文帝辭也晉仍舊名言聖皇德配堯舜又有吕望之佐以濟大功致太平也若梁沈約桂舟既容與劉孝威釣舟畫彩鷁但稱綸釣嬉遊而巳東越河濟水遙望大海涯釣竿何珊珊魚尾何篩篩行路之好者芳餌欲何為晉傅玄釣竿何冉冉甘餌芳且鮮臨川運思心微綸沈九淵太公寶此術乃在靈祕篇機變隨物移精妙貫未然遊魚驚著釣潛龍飛戾天戾天安所至撫翼翔太清太清一何異兩儀出渾成玉衡正三辰造化賦羣形退願輔聖君與神合其靈我君𢎞逺略天人不足并天人初并時昧昧何芒芒日月有徴兆文象興二皇蚩尤亂生民黃帝用兵征萬方逮夏禹而德衰三代不及虞與唐我皇聖德配堯舜受禪即祚享天祥率土蒙祐靡不肅庶事康庶事康穆穆明明荷百祿保無極永太平梁沈約桂舟既容與緑浦復回紆輕絲動弱芰微楫起單鳬扣舷忘日莫卒歲以為娛劉孝綽釣舟畫彩鷁魚子服冰紈金轄茱萸網銀鈎翡翠竿斂橈隨水脈急槳渡江湍湍長自不辭前蒲有佳期船交棹影合浦深魚出遲荷根時觸餌菱芒乍罥絲蓮渡江南手衣渝京兆眉垂竿自來樂誰能為太師古樂府卷二
