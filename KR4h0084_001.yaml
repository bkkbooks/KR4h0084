body:
  text: 古樂府卷一元左克明撰古歌謠辭上古帝王之世德化下洽民樂無事故擊壤之老人康衢之童子與夫卿雲之瑞南風之時民莫不因之而成歌其後風衰雅缺而妖淫靡曼之聲起至周衰有秦青復有韓娥衛之王豹齊之綿駒皆稱善歌世傳其能然並徒歌也爾雅曰徒歌謂之謠廣雅曰聲比於瑟琴曰歌韓詩章句云有章曲謂之歌無章曲謂之謠梁元章纂要云齊歌曰謳吳歌曰歈楚歌曰豔浮歌曰哇振旅而歌曰凱歌堂上奏樂而歌曰登歌亦曰升歌漢時有相和歌本出於街陌謳謠而吳歌雜曲始亦徒歌後入於樂府故歌有因地而作者易水垓下之類是也有因人而作者五子華元之類是也寧戚以困而歌項籍以窮而歌鄭子産孔子漢張堪皇甫嵩郭喬卿俱取其政治而歌雖所遇不同至於發乎情則一也厯世已來歌謠雜出今採録以繫其末云擊壤歌世紀帝堯之世天下大和百姓無事有八九十老人擊壤而歌風土記壤以木為之前廣後鋭長三四寸形如履臘節童少以為戲分部如摘博藝經又云長尺四闊三寸將戲先側一壤于地遙於三四十步以手中壤敲之中者為上古野老戲也日出而作日入而息鑿井而飲耕田而食帝力於我何有哉康衢歌堯微服遊於康衢聞童兒謠堯喜問曰誰教爾為此言童兒曰聞之大夫大夫曰古詩也堯還宫召舜因禪以天下立我蒸民莫匪爾極不識不知順帝之則舜歌舜雖治定功成禮備樂和而君臣之間或作歌以責難於臣或賡歌以責難於君三百篇其權輿於此乎股肱喜哉元首起哉百工熙哉賡歌元首明哉股肱良哉庶事康哉又賡歌元首叢脞哉股肱惰哉萬事墮哉卿雲歌尚書大傳曰舜將禪禹於時俊又百工相和而歌卿雲帝乃唱之曰云云八伯咸進稽首曰云云帝乃再歌曰云云史記天官書曰若煙非煙若雲非雲郁郁紛紛蕭索輪囷是謂慶雲慶雲即卿雲蓋和氣也卿雲爛兮舜明明上天八伯日月有常舜卿雲爛爛糾漫漫兮日月光華旦復旦兮明明上天爛然星陳日月光華𢎞豫一人日月有常星辰有行四時順經萬姓允誠於豫論樂配天之靈遷于賢善莫不咸聽鼚乎鼓之軒乎舞之精華已竭褰裳去之南風歌樂録曰舜彈五弦之琴歌南風之詩樂書曰舜歌南風而天下治南風者生長之音也舜樂好之樂與天地同意得萬國之歡心故天下治也南風之薰兮可以解吾民之愠兮南風之時兮可以阜吾民之財兮夏人歌尚書大傳曰夏人飲酒醉者持不醉者不醉者持醉者而歌曰云云伊尹退而更曰云云薄湯之都也盍歸乎薄薄亦大矣夏人覺兮較兮吾大命格兮去不善而善何不樂兮伊尹江水沛兮舟楫敗兮我王廢兮趣歸於薄薄亦大兮夏人樂兮樂兮四牡驕兮六轡沃兮去不善而從善何不樂兮伊尹五子歌大康以逸豫滅厥德盤遊無度為羿所距而失邦昆弟五人咸怨須于洛汭述大禹之戒以作歌皇祖有訓民可近不可下民惟邦本本固邦寧豫視天下愚夫愚婦一能勝豫一人三失怨豈在明不見是圖豫臨兆民懍乎若朽索之馭六馬為人上者奈何不敬訓有之內作色荒外作禽荒甘酒嗜音峻宇雕牆有一于此未或不亡惟彼陶唐有此冀方今失厥道亂其紀綱乃底滅亡明明我祖萬邦之君有典有則貽厥子孫關石和鈞王府則有荒墜厥緒覆宗絶祀嗚呼曷歸豫懷之悲萬姓仇豫豫將疇依鬱陶乎豫心顔厚有忸怩弗慎厥德雖悔可追黃澤辭穆天子傳曰天子東遊于黃澤使宫樂謠云皇之陀其馬噴沙皇人威儀皇之澤其馬噴玉皇人夀穀白雲謠穆天子傳曰天子觴西王母于瑤池之上西王母為天子謠天子答之白雲在天山陵自出道里悠逺山川間之將子無死尚復能來穆天子謠子歸東土和洽諸夏萬民平均吾願見汝比及三年將復而野南山歌淮南子曰寧越欲干齊桓公困窮無以自達於是為商旅將任車以適於齊莫宿於郭門外桓公郊迎客夜開門辟賃車爝火甚衆越飯牛車下望見桓公而悲擊牛角而疾商歌桓公聞之曰異哉非常人也命後車載之越一作戚南山矸白石爛生不遭堯與舜禪短布單衣適至骭從昏飯牛薄夜半長夜漫漫何時旦華元歌宋人增築舊城華元為植巡功城者歌以譏之華元亦作歌使驂乘者答之城人又復歌之睅其目皤其腹棄甲而復于思于思棄甲復來驂乘賡歌曰牛則有皮犀兕尚多棄甲則那役人又賡歌曰從其有皮丹漆若何澤門之晢歌皇國父為宋太宰為平公築臺於門乃宋東城南門也皇國父曰晢居近之時妨農收稻子罕請畢農功而後興役公勿許築者歌以美子罕澤門之晢實興我役邑中之黔實慰我心子産歌鄭子産為政使都鄙有章上下有服田有封洫廬井有伍豐卷將祭請田焉弗許豐卷怒退而徵役子産奔晉子皮止之而逐豐卷豐卷奔晉子産請其田里三年而復之反其田里及其入焉從政一年輿人歌謠以誦之及三年又誦之取我衣冠而褚之取我田疇而伍之孰殺子産吾其與之又歌曰我有子弟子産誨之我有田疇子産殖之子産而死誰其嗣之庚癸歌魯哀公會單平公晉定公吳夫差于黃池吳晉爭先趙鞅呼司馬寅曰日旰矣大事未成二臣之罪也對曰請少待之乃先晉人吳申叔儀作歌乞糧於公孫有山氏有山氏賡歌以復之故教申叔儀為私隱以登首山而呼曰庚癸乎則諾此言吳子不與衆同飢渴所以取亡也佩玉繠兮余無所繫之旨酒一盛兮余與褐之父睨之賡歌梁則無矣粗則有之孔子歌孔子為魯司寇攝行相事其初人歌以謗之三月政成化行民歌以誦之謗歌曰麛裘而鞞投之無戾鞞之麛裘投之無郵誦歌曰衮衣章甫實獲我所章甫衮衣惠我無私孺子歌孔子聞孺子歌聲入心通無非至理喻門人聽之清斯濯纓濁斯濯足矣自取之也又曰漁父歌滄浪之水清兮可以濯我纓滄浪之水濁兮可以濯我足接輿歌孔子將適楚故接輿歌而過其車前譏其不能隱為德衰也接輿蓋知尊孔子而趨不同者也鳳兮鳳兮何德之衰往者不可諫來者猶可追已而已而今之從政者殆而原壤歌孔子之故人曰原壤其母死孔子助之沐槨原壤登木曰久矣豫之不託於音也蓋母死而歌非禮之甚夫子以其故人故為弗聞也者而過之以全其交也貍首之斑然執女手之卷然夢奠歌孔子蚤作負手曵杖逍遙於門乃作歌既歌而入謂子貢曰夫明王不興而天下其孰能宗豫豫殆將死也蓋寢疾七日而沒泰山其頽乎梁木其壞乎哲人其萎乎成人歌成人有其兄死而不為衰者聞髙子臯將為成宰懼而為衰成人歌之蠶則績而蟹有匡范則冠而蟬有緌兄則死而子臯為之衰徐人歌劉向新序曰延陵季子將聘晉帶寶劍以過徐君徐君觀劍不言而色欲之季子未獻也然其心許之矣使反而徐君已死季子於是以劍帶徐君墓樹而去徐人為之歌延陵季子兮不忘故脫千金之劍兮帶丘墓驪駒歌此逸詩也漢書儒林傳王式除為博士既至舍中會諸大夫共持酒肉勞式皆注意髙仰之博士江公心嫉式謂歌吹諸生曰歌驪駒式曰聞之於師客歌驪駒主人歌客毋庸歸今日諸君為主人日尚早未可也驪駒者客欲去歌之故式以為言也驪駒在門僕夫俱存驪駒在路僕夫整駕越人歌劉向説苑曰鄂君子晢泛舟於新波之中乘青翰之舟張翠蓋會鐘鼓之音畢榜枻越人擁楫而歌於是鄂君乃揄修袂行而擁之舉繡被而覆之鄂君楚王母弟也今夕何夕兮搴洲中流今日何日兮得與王子同舟蒙羞被好兮不訾詬恥心幾煩而不絶兮得知王子山有木兮木有枝心悅君兮君不知采葛婦歌吳越春秋曰采葛越之婦人傷越王用心之苦乃作若何之歌嘗膽不苦味若飴今我采葛以作絲紫玉歌樂府詩集曰紫玉吳王夫差女也作歌詩以與韓重南山有鳥北山張羅意欲從君讒言孔多悲結成疹沒身黃壚命之不造寃如之何羽族之長名為鳳凰一日失雄三年感傷雖有衆鳥不為匹雙故見鄙姿逢君輝光身逺心近何曾暫忘渡易水一曰荆軻歌史記曰燕大子丹使荆軻刺秦王丹送之至於易水之上軻使髙漸離擊築軻和而歌為變微之聲又前歌云云復為羽聲慷慨於是就車而去風蕭蕭兮易水寒壯士一去兮不復還垓下歌漢書曰髙祖圍項羽垓下是夜聞漢軍皆楚歌驚曰漢已得楚乎起飲帳中有美人姓虞氏常從駿馬名騅常騎乃悲歌慷慨自為歌詩數曲美人和之羽泣下數行逆上馬潰闈南出平明漢軍乃覺按琴集有力拔山操項羽所作也近世有虞美人曲亦出於此力拔山兮氣蓋世時不利兮騅不逝騅不逝兮可奈何虞兮虞兮奈若何大風歌漢書曰髙祖既定天下還過沛留置酒沛宫悉召故人父老子弟佐酒發沛中兒得百二十人教之歌酒酣帝擊築自歌令兒皆和習之帝自起舞按琴操有大風起漢髙帝所作也大風起兮雲飛揚威加海內兮歸故鄉安得猛士兮守四方楚歌漢書曰髙祖欲立戚夫人子趙王如意而廢太子後不果戚夫人泣涕帝曰為我楚舞吾為楚歌其旨言太子得四皓為輔羽翼成就不可易也顔師古曰楚歌者楚人之歌猶吳歈越吟也鴻鵠髙飛一舉千里羽翼已就橫絶四海橫絶四海又可奈何雖有繒繳尚安所施平城歌漢書胸奴傳曰髙祖自將兵三十二萬擊韓王信帝先至平城步兵未盡到冒頓緃精兵三十餘萬圍帝於白登七日漢兵中外不得救餉樊噲時為上將軍不能解圍天下皆歌之後用陳平祕訃得免白登在平城東南去平城十餘里平城之下亦誠苦七日不食不能彀弩戚夫人歌漢書外戚傳曰髙祖得定陶戚姬愛幸生趙隱王如意惠帝立吕后為皇太后乃令永巷囚戚夫人髠鉗衣赭衣令舂戚夫人舂且歌太后聞之大怒曰乃欲倚子邪召趙王殺之戚夫人遂有人彘之禍子為王母為虜終日舂薄暮常與死為伍相離三千里當誰使告汝趙幽王歌漢書曰趙幽王友髙帝之子孝惠時友以諸吕女為后不愛愛他姬諸吕女讒之於太后太后怒召趙王置邸令衛圍守之趙王餓乃作歌遂幽死諸吕用事兮劉氏微迫脅王侯兮強授我妃我妃既妒兮誣我以惡讒女亂國兮上曾不寤我無忠良兮何故棄國自決中野兮蒼天與直于嗟不可悔兮寧早自賊為王餓死兮誰者憐之吕氏絶理兮託天報仇畫一歌漢髙帝與蕭何定天下法令既明何薨參代何為相謂帝曰一遵約束而勿失不亦可乎帝曰善參為相國三年百姓歌之曰蕭何為法較若畫一曹參代之守而勿失戴其清淨民以寧一秋風詞漢武帝故事曰帝行幸河東祠后土顧視帝京欣然中流與羣臣飲宴帝歡甚乃自作秋風詞秋風起兮白雲飛草木黃落兮雁南歸蘭有秀兮菊有芳懷佳人兮不能忘泛樓船兮濟汾河橫中流兮揚素波簫鼓鳴兮發棹歌歡樂極兮哀情多少壯幾時兮奈老何瓠子歌二首史記河渠書漢武帝既封禪乃使汲仁郭昌發卒數萬人塞瓠子決河後上自臨祭沈白馬玉璧令羣臣從官皆負薪置決河時東流郡燒草薪柴少乃下淇園之竹以為楗天子悼功之不成乃作歌二章於是卒塞瓠子築宫其上曰宣房宫瓠子決兮將奈何皓皓旰旰兮閭殫為河殫為河兮地不得寧功無已時兮吾山平吾山平兮巨野溢魚沸鬱兮柏冬日延道弛兮離常流蛟龍騁兮方逺遊歸舊川兮神哉沛不封禪兮安知外為我謂河伯兮何不仁泛濫不止兮愁吾人齧桑浮兮淮泗滿久不返兮水維緩河湯湯兮激潺湲北渡迃兮浚流難搴長茭兮湛美玉河伯許兮薪不屬薪不屬兮衛人罪燒蕭條兮噫乎何以禦水隤林竹兮楗石災宣房塞兮萬福來天馬歌漢武帝紀元鼎四年秋馬生渥窪中作天馬之歌太初四年春二師將軍李廣利斬大宛王首獲汗血馬來作西極天馬之歌太乙況天馬下霑赤汗沫流赭志俶儻精權竒籋音躡浮雲暗烏感反上馳體容與迣音例萬里今安匹龍為友天馬徠從西極涉流沙九夷服天馬徠出泉水虎脊兩化若鬼變化如神天馬徠厯無皂經千里循東道天馬徠執徐時歲在辰將搖舉誰與期天馬徠開逺門竦豫身逝昆崙天馬徠龍之媒遊閶闔登玉臺蒲梢天馬歌史記樂書稱武帝伐大宛得千里馬名蒲稍作歌天馬徠兮從西極經萬里兮歸有德承靈威兮降外國涉流沙兮四夷服李夫人歌漢書外戚傳曰孝武李夫人本以倡進初武帝愛其兄延年平陽公主因言延年有女弟帝乃召見之實妙麗善舞由是得幸夫人少而蚤卒帝思念不已方士齊人少翁言能致其神乃夜張燈燭設帷帳陳灑肉而令帝居帷帳遙望見好女如李夫人之貌還幄坐而步人不得就視帝愈益相思悲感為作詩令樂府諸音家絃歌之是邪非邪立而望之翩何姍姍其來遲李延年歌漢書外戚傳曰李延年性知音善歌舞武帝愛之嘗侍上起舞而歌延年後為協律都尉北方有佳人絶世而獨立一顧傾人城再顧傾人國寧不知傾城與傾國佳人難再得烏孫公主歌漢書西域傳曰武帝元封中遣江都王建女細君為公主以妻烏孫王昆莫公主至其國自治宫室居歲時一再與昆莫會置酒飲食昆莫年老言語不通公主悲乃自作歌吾家嫁我兮天一方逺託異國兮烏孫王穹廬為室兮旃為牆以肉為食兮酪為漿居常土思兮心內傷願為黃鵠兮歸故鄉黃鵠歌西京雜記始元元年黃鵠下太液池帝為此歌黃鵠飛兮下建章羽肅肅兮行蹌蹌金為衣兮菊為裳唼喋荷荇出入蒹葭自顧菲薄愧爾嘉祥漢成帝時歌謠漢書五行志成帝時歌謠也桂亦色漢家象花不實無繼嗣也王莽自謂黃象黃爵巢其顛也邪徑敗良田讒言亂善人桂樹花不實黃爵巢其顛昔為人所羡今為人所憐城上烏童謠後漢書五行志桓帝之初京都童謠按此皆謂為政貪也城上烏尾畢逋者處髙利獨食不與下共謂人主多聚斂也公為吏豫為徒者言蠻夷將畔逆父既為軍吏其子又為卒徒往擊之也一徒死百乘車者言前一人往討胡既死矣後又遣百乘車往車班班入河間者言桓帝將崩乘輿班班入河間迎靈帝也河間姹女工數錢以錢為室金為堂者言靈帝既立其母永樂太后好聚金以為堂也石上慊慊舂黃梁言永樂惟積金錢慊慊常若不足吏人舂黃梁而食之也梁下有懸鼓我欲擊之丞卿怒者言永樂教靈帝使賣官受錢所祿非其人天下忠篤之士怨望欲擊懸鼓以求見丞卿主者亦復諂順怒而止我也劉昫以為此謠後驗竟為靈帝作言一徒似斥桓帝帝責任羣閹參委機政左右前後莫非刑人有同囚徒之長故言寄一徒也且又弟則廢黜身無嗣塊然單獨非一而何百乘車者乃國之君解犢後徵正膺斯數繼以班班尤得以類焉解犢靈帝所封也城上烏尾畢逋公為吏子為徒一徒死百乘車車班班入河間河間姹女工數錢以錢為室金為堂石上慊慊舂黃梁梁下有懸我欲擊之丞卿怒鮑司𨽻歌樂府廣題列異傳鮑宣宣子永永子昱三世皆為司𨽻而乘一驄馬京師人歌之鮑氏驄三人司𨽻再入公馬雖瘦行步工張堪歌漢光武十五年張堪拜漁陽大守堪視事八年胸奴不敢犯塞勸民耕稼以致殷富百姓喜其德政以歌之桑無附枝麥穗兩岐張君為政樂不可支五噫歌三輔決録梁鴻束出關過京師作五噫之歌肅宗聞而非之求鴻不得陟彼北邙兮噫顧瞻帝京兮噫宫闕崔嵬兮噫民之劬勞兮噫遼遼未央兮噫雞鳴歌樂府廣題曰漢有雞鳴衛士主雞鳴宫中漢書曰髙祖團項羽垓下羽是夜聞漢軍四面皆楚歌應劭曰楚歌者雞鳴歌也按周禮雞人掌大祭祀夜呼旦以嘂百官則所起亦逺矣東方欲明星爛爛汝南晨雞登壇喚曲終漏盡嚴具陳月沒星稀天下旦千門萬户遞魚鑰宫中城上飛烏鵲岑君歌後漢書岑熙為魏郡太守招聘隱逸與參政事無為而化視事二年輿人歌之我有枳棘岑君伐之我有蟊賊岑君遏之狗吠不驚足下生氂含哺鼓腹焉知凶災我喜我生獨丁斯時美矣岑君於戲休兹郭喬卿歌後漢書郭賀字喬卿建武中為尚書令在職六年拜荆州刺史到官有殊政百姓歌之顯宗巡狩到南陽特見嗟賞賜以三公之服敇行部去襜帷使百姓見其容服以章有德厥德仁明郭喬卿中正朝廷天下平皇甫嵩歌後漢書皇甫嵩為冀州收請冀州一年田租以贍飢民百姓歌之天下大亂兮市為墟母不保子兮妻失夫賴得皇甫兮復安居劉君歌後漢書劉陶舉孝廉除順陽長縣多姦猾陶到官按發若神以病免吏民思而歌之邑然不樂思我劉君何時復來安此下民洛陽令歌長沙耆舊傳祝良字石卿為洛陽令歲時亢旱天子祈雨不得良乃暴身階庭告誠引罪自晨至中紫雲沓起甘雨登降人為之歌天久不雨蒸人失所天王自出祝令特苦精符感應滂沱下雨滎陽令歌殷氏世傳殷褒滎陽令廣築學館會集朋徒民知禮讓乃歌之云滎陽令有異政修立學校人易性令我子弟恥訟爭京兆謠後漢書曰李燮拜京兆詔發西園錢燮上封事遂止不發吏民愛敬乃為此謠我府君道教舉恩如春威如虎剛不吐柔不茹愛如母訓如父束晢歌晉書束晢陽平元城人太康中郡界大旱晢為邑人請兩三日而雨注衆謂晢誠感而為作歌束先生通神明請天三日甘雨零我黍以育我稷以生何以酬之報束長生豫州歌晉書祖逖為豫州刺史躬自儉約督課農桑克已務施不畜資産子弟耕耘負擔樵薪又收葬枯骨為之祭醊百姓感悅嘗置大會耆老中坐流涕曰吾等老矣更得父母死將何恨乃歌曰幸哉遺黎免俘虜三辰既朗遇慈父玄酒忘勞甘瓠脯何以詠思歌且舞應詹歌王澄惠帝末為荆州牧假應詹督南平天門武陵三郡軍事天下大亂詹境獨全百姓歌之亂離既普殆為灰朽僥幸之運賴兹應后歲寒不凋孤境獨守拯我塗炭惠隆邱阜潤同江海恩猶父母吳人歌鄧攸元帝時為吳郡太守刑政清明百姓歡悅後稱疾去百姓數千人留牽攸船不得進攸乃少停夜中發去吳人歌之紞如打五鼓雞鳴天欲曙鄧侯挽不留謝令推不去隴上歌晉書載記曰劉曜圍陳安於隴城安敗南走陜中曜使將軍平先邱中伯率徑騎追安安與壯士十餘騎於陜中格戰安左手奮七尺大刀右手執丈八蛇矛近交則刀矛俱發輒害五六逺則雙帶鞬服左右馳射而走平先亦壯健絶人與安搏戰三交奪其蛇矛而退遂追斬于澗曲安善於撫接吉凶夷險與衆同之及其死隴上為之歌矅聞而嘉傷命樂府歌之隴上壯士有陳安軀幹雖小腹中寬愛養將士同心肝𩣘驄父馬鐵鍛鞍七尺大刀奮如湍丈八蛇矛左右盤十蕩十決無當前戰始三交失蛇矛棄我𩣘驄竄巖幽為我外援而懸頭西流之水東流河一去不還奈子何裴公歌北史曰裴俠為河北郡守躬履儉素愛民如子郡舊有漁獵夫三十人以供郡守俠曰以口腹役人吾所不為也悉罷之又有丁三十人供郡守役俠亦罷之不以入私並收庸為市官馬歲時既積馬遂成馬羣去職之日一無所取民歌之云肥鮮不食丁庸不取裴公貞惠為世規矩敇勒歌樂府廣題曰北齊神武攻周玉璧士卒死者十四五神武恚憤疾發周王下令曰髙歡鼠子親犯玉璧劍弩一發元凶自斃神武聞之勉坐以安士衆悉引諸貴使斛律金唱敇勒神武自和之其歌本鮮卑語易為齊言故其句長短不齊敇勒川隂山下天似穹廬籠蓋四野天蒼蒼野茫茫風吹草低見牛羊東征歌隋王通杜淹文中世家曰隋仁夀中文中子西遊長安見文帝奏太平十有二策帝下其議於公卿公卿不悅文中子知謀之不用作東征之歌而歸帝聞而再徵之不至我思國家兮逺遊京畿忽逢帝王兮降禮布衣遂懷古人之心兮將興太平之基時異事變兮志乖願違吁嗟道之不行兮垂翅東歸皇之不斷兮將身西飛淫預歌酈道元水經注曰白帝山城水門之西江中有孤石名淫豫石水冬出二十餘丈夏則沒亦有裁出焉江水東徑廣峽溪乃三峽首之也峽中有瞿塘黃龕二灘夏水回復沿泝所忌十道志曰淫豫石與城郭門外石潛通蜀人往燒火伏石則淫預邊沸國史補曰蜀之三峽最號峻急四月五月尤險故行者歌之淫或作艷預或作豫灧預大如馬瞿唐不可下灧預大如牛瞿唐不可流淫預大如服瞿塘不可觸金沙浮轉多桂浦忌經過挾瑟歌春風宛轉入曲房兼送小苑百花香白馬金鞍去未返紅粧玉筯下成行靈芝歌因靈寢兮産靈芝象三德兮瑞應圖延夀命兮光此都配上帝兮象太微參日月兮揚光輝古樂府卷一
