body:
  text: 古樂府卷七元左克明撰淸商曲歌辭下西曲歌石城樂古辭唐書樂志曰石城樂者宋臧質所作也石城在竟陵質嘗為竟陵郡於城上眺矚見羣少年歌謡通暢因作此曲生長石城下開窗對城樓城中諸少年出入見衣投陽春百花生摘插環髻前捥指踏忘愁相與及盛年布帆百餘幅環環在江津執手雙淚落何時見歡還大艑載三千漸水丈五餘水高不得渡與歡合生居聞歡遠行去相送方山亭風吹黃蘖萎惡聞苦離聲烏夜啼古辭唐書樂志曰烏夜啼者宋臨川王義慶所作也元嘉十七年徙彭城王義康於豫章義慶時為江州至鎮相見而哭文帝聞而怪之徴還慶大懼伎妾夜聞烏啼聲扣齋閣云明日應有赦其年更為南兖州刺史因作此歌故其和云夜夜望郎來籠窗窗不開今所傳歌辭似非義慶本音歌舞諸少年娉婷無種迹菖蒲花可憐聞名不曾識長檣鐵鹿子布帆阿那起詫儂安在間一去數千里辭家遠行去儂歡獨離居此日無啼音裂帛作還書可憐烏臼鳥強言知天曙無故三更啼歡子冒暗去烏生知欲飛飛飛各自去生離無安心夜啼至天曙籠窗窗不開蕩户户不動歡下葳蕤籥交儂那得往遠望千里煙隱當在歡家欲飛無兩翅當奈獨思何巴陵三江口蘆荻齊如麻執手與歡别痛切當奈何梁簡文帝緑草庭中望明月碧玉堂裏對金鋪鳴弦撥捩發初異挑琴欲吹衆曲殊不疑三足朝含影直言九子夜相呼羞言獨眠枕下流託道單棲城上烏烏棲曲梁簡文帝芙蓉作船絲作筰北斗橫天月將落採蓮渡頭擬黃河郎今欲渡畏風波浮雲似帳月如鈎那能夜夜南陌頭宜城投泊今行熟停鞍繫馬暫棲宿靑牛丹轂七香車可憐今夜宿倡家倡家高樹烏欲棲羅幃翠被任君低織成屏風金屈膝朱脣玉面燈前出相看氣息望君憐誰能含羞不自前梁元帝沙棠作船桂為楫夜渡江南採蓮葉復值西施新浣沙共向江干眺月華梁蕭子顯芳樹歸飛聚儔匹猶有殘光半山日莫憚褰裳不相求漢臯遊女習風流徐陵繡帳羅幃隱燈燭一夜千年猶不足唯憎無賴汝南雞天河未落猶爭啼棲烏曲陳後主陌頭新花歷亂生葉裏啼烏送春情長安遊俠無數伴白馬驪珂路中滿合歡襦薰百和香牀中被織兩鴛鴦烏啼漢沒天應曙只持懷抱送郎去陳江總桃花春水木蘭橈金羈翠蓋聚河橋隴西上計應行去城南美人啼著曙估客樂齊武帝古今樂録曰估客樂者齊武帝之所製也帝布衣時嘗遊樊鄧登祚以後追憶往事而作歌使太樂令劉瑶管弦被之教習卒遂無成有人啓釋寶月善解音律帝使奏之旬日之中便就諧合敕歌者常重為感憶之聲猶行於世寶月又上兩曲帝數乘龍舟遊五城江中放觀以紅越布為帆緑絲為帆繂鍮石為篙足篙榜者悉著鬱林布作淡黃袴列開使江中衣出五城殿猶在齊舞十六人梁八人唐書樂志曰梁改其名為商旅行昔經樊鄧役阻潮梅根渚感憶追往事意滿情不敘齊釋寶月郎作十里行儂作九里送拔儂頭上叉與郎資路用有信數寄書無信心相憶莫作甁落井一去無消息大艑珂峩頭何處發揚州借問艑上郎見儂所歡不初發揚州時船出平津泊五兩如竹林何處相尋慱陳後主三江結儔侣萬里不辭遙恆隨鷁首舫屢逐雞鳴潮莫愁樂古辭唐書樂志曰莫愁樂者出於石城樂石城有女子名莫愁善歌謠石城樂和中復有莫愁聲因有此歌古今樂録曰莫愁樂亦云蠻樂舊舞十六人梁八人樂府解題曰古歌亦有莫愁洛陽女與此不同莫愁在何處莫愁石城西艇子打兩槳催送莫愁來聞歡下揚州相送楚山頭探手抱腰看江水斷不流襄陽樂古辭古今樂録曰襄陽樂者宋隋王誕之所作也誕始為襄陽郡元嘉二十六年仍為雍州刺史夜聞諸女歌謡因而作之所以歌和中有襄陽來夜樂之語也朝發襄陽城暮至大堤宿大堤諸女兒花豔驚郎目爛漫女蘿草結曲繞長松三春雖同色歲寒非處儂黃鵠參天飛中道鬱徘徊腹中車輪轉歡今定憐誰揚州蒲煆環百錢兩三叢不能買將還空手攬抱儂女蘿自微薄寄託長松表何惜負霜死貴得相纒繞惡見多情歡罷儂不相語莫作烏集林忽如提儂去三洲歌古辭唐書樂志曰三洲商人歌也古今樂録曰三洲歌者商客數遊巴陵三江口往還因共作此歌送歡板橋灣相待三山頭遙見千幅帆知是逐風流風流不暫停三山隱行舟願作比目魚隨歡千里遊湘東酃醁酒廣州龍頭鐺玉樽金鏤碗與郎雙杯行陳後主春江聊一望細草遍長洲沙汀時起伏畫舸屢淹留襄陽踏銅蹄梁武帝隋書樂志曰梁武帝之在雍鎮有童謡云襄陽踏銅蹄反縛揚州兒識者言白銅蹄謂金蹄為馬也白金色也及義師之興實以鐡騎揚州之士皆面縛果如謡言故即位之後更造新聲帝自為之詞三曲又令沈約為三曲以被管弦古今樂録曰襄陽踏銅蹄者梁武西下所製也沈約又作其和云襄陽白銅蹄聖德應乾來陌頭征人去閨中女下機含情不能言送别沾羅衣草樹非一香花葉百種色寄語故情人知我心相憶龍門紫金鞍翠眊白玉羈照耀雙闕下知是襄陽兒梁沈約分手桃林岸望别峴山頭若欲寄音信漢水向東流生長宛水上從事襄陽城一朝遇神武奮翼起先鳴蹀鞚飛塵起左右自生光男兒得富貴何必在歸鄉採桑度古辭採桑度一曰採桑唐書樂志曰採桑因三洲曲而生此聲調也採桑度梁時作水經曰河水過屈縣西南為採桑津春秋僖公八年晉里克敗狄於採桑是也蠶生春三月春桑正含緑女兒採春桑歌吹當春曲冶遊採桑女盡有芳春色姿容應春媚粉黛不加飾繫條採春桑採葉何紛紛採桑不裝鈎牽壞紫羅裙語歡稍養蠶一頭養百塸奈當黑瘦盡桑葉常不周春月採桑時林下與歡俱養蠶不滿百那得羅繡襦採桑盛陽月緑葉何翩翩攀條上樹表牽壞紫羅裙偽蠶化作繭爛漫不成絲徒勞無所獲養蠶特底為江陵樂古辭陽春二三月相將踏百草逢人駐步看揚聲皆言好青陽度古今樂録曰青陽度倚歌凡倚歌悉用鈴鼓無弦有吹青荷蓋緑水芙蓉披紅鮮下有並根藕上生並頭蓮青驄白馬青絲白馬紫絲韁可憐石橋根柏梁汝忽千里去無常願得到頭還故鄉繫馬可憐著長松遊戲徘徊五湖中借問湖中採菱婦蓮子青荷可得否可憐白馬高纒騣著地躑躅多徘徊問君可憐六萌車迎取窈窕西曲娘問君可憐下都去何得見君復西歸齊唱可憐使人惑晝夜懷歡何時忘共戲樂齊世方昌書軌同萬宇獻樂列國風時泰民康人物盛腰鼓鈴柈各相競長袖翩翩若鴻驚纎腰嫋嫋會人情觀風採樂德化昌聖皇萬壽樂未央安東平凄凄烈烈北風為雪船道不通步道斷絶吳中細布闊幅長度我有一端與郎作袴微物雖輕拙手所作餘有三丈為郎別厝制為輕巾以奉故人不特作好與郎拭塵東平劉生復感人情與郎相知當解千齡女兒子古今樂録曰女兒子已下並倚歌也巴東三峽猿鳴悲夜鳴三聲淚沾衣我欲上蜀蜀水難踏蹀珂頭腰環環來羅鬱金黃花標下有同心草草生日已長人生日就老君子防未然莫近嫌疑邉瓜田不躡履李下不正冠白頭不忍死心愁皆敖然遊戲泰始世一日當千年那呵灘沿江引百丈一濡多一艇水上郎簷篙何時至江陵聞歡下揚州相送江津彎願得篙簷折交郎到頭還孟珠陽春二三月草與水同色攀條摘香花言是歡氣息陽春二三月草與水同色道逢遊冶郎恨不早相識翳樂人生歡愛時少年新得意一旦不相見輒作煩寃思陽春二三月相將舞翳樂曲曲隨時變特許豔郎目人言揚州樂揚州信自樂總角諸少年歌舞自相逐夜黃湖中百種鳥半雌半是雄鴛鴦逐野鴨恐畏不成雙夜度娘夜來冒霜雪晨去履風波雖得敘微情奈儂身苦何長松標落落千丈松晝夜對長風歲暮霜雪時寒苦與誰雙雙行纒朱絲繫腕繩真如白雪凝非但我言好衆情共所稱黃督喬客他鄉人三春不得歸願看楊柳樹已復藏班隼平西樂我情與歡情二情感蒼天形雖胡越隔神交中夜間白附鳩石頭龍尾彎新亭送客渚酤酒不取錢郎能飲幾許拔蒲青蒲銜紫茸長葉復從風與君同舟去拔蒲五湖中朝發桂蘭渚晝息桑榆下與君同拔蒲竟日不成把壽陽樂可憐八公山在壽陽別後莫相忘東臺百餘尺凌風雲别後不忘君梁長曲水流明如鏡雙林與郎照辭家遠行去空為君明知歲月駛作蠶絲春蠶不應老晝夜常懷絲何惜微軀盡纒綿自有時素絲非常質屈折成綺羅敢辭機杼勞但恐花色多楊叛兒唐書樂志曰楊叛兒本童謡歌也齊隆昌時女巫之子曰楊旻少時隨母入內及長為何后寵童謡云楊婆兒共戲來而歌語訛遂成楊伴兒古今樂録曰楊叛兒送聲云叛兒教儂不復相思暫出白門前楊柳可藏烏歡作沈水香儂作慱山爐送郎乘艇子不作遭風慮橫篙擲去槳願倒逐流去歡欲見蓮時移湖安屋裏芙蓉繞林生眠卧抱蓮子楊叛西隨曲柳花經東隂風流隨遠近飄揚悶儂心西烏夜飛古辭古今樂録曰西烏夜飛者宋元徽五年荆州刺史沈攸之所作也攸之舉兵發荆州東土未敗之前思歸京師所以歌和云白日落西山還去來送聲云折趐鳥飛何處被彈歸陽春二三月諸花盡芳盛特底喚歡來花笑鶯歌詠感郎﨑嶇情不復自顧慮臂繩雙入結遂成同心去月節折楊柳歌古辭正月歌春風尚蕭條去故來入新苦心非一朝折楊柳愁思滿腹中歷亂不可數二月歌翩翩烏入鄉道逢雙燕飛勞君看三陽折楊柳寄言語儂歡尋還不復久三月歌泛舟臨曲池仰頭看春花杜鵑緯林啼折楊柳雙下俱徘徊我與歡共取四月歌芙蓉始懷蓮何處覔同心俱生世尊前折楊柳捻香散名花志得長相取五月歌菰生四五尺素身為誰珍盛年將可惜折楊柳作得九子粽思想勞歡手六月歌三伏熱如火籠窗開北牖與郎對踏坐折楊柳銅塸貯蜜漿不用水洗溴七月歌織女遊河邉牽牛顧自歡一會復周年折楊柳攬結長命草同心不相負八月歌迎歡裁衣裳日月流如水白露凝庭霜折楊柳夜聞搗衣聲窈窕誰家婦九月歌井菊吐黃花非無杯觴用當奈許寒何折楊柳授歡羅衣裳含笑言不取十月歌大樹轉蕭索天隂不作雨嚴霜半夜落折楊柳林中與松柏歲寒不相負十一月歌素雪任風流樹木轉枯悴松柏無所憂折楊柳寒衣履薄氷歡詎知儂否十二月歌大寒歲欲暮春秋及冬夏苦心停欲度折楊柳沈亂枕席間纒綿不覺久閏月歌成閏暑與寒春秋補小月念子無時間折楊柳隂陽推我去那得有定主江南弄梁武帝古今樂録曰江南弄三洲韻和云陽春路娉婷出綺羅衆花雜色滿上林舒芳耀緑垂輕隂連手躞蹀舞春心舞春心臨歲腴中人望獨踟蹰龍笛曲古今樂録曰龍笛曲和云江南音一唱直千金馬融長笛賦曰近世雙笛從羌起羌人伐竹未及巳龍鳴水中不見已截竹吹之聲相似然則龍笛曲蓋因聲如龍鳴而名曲美人綿眇在雲堂雕金鏤竹眠玉床婉愛寥亮繞虹梁繞虹梁流月臺駐狂風鬱徘徊採蓮曲古今樂録曰採蓮曲和云採蓮渚窈窕舞佳人遊戲五湖採蓮歸發花田葉芳襲衣為君儂歌世所希世所希有如玉江南弄採蓮曲鳯笙曲古今樂録曰鳯笙曲和云弦吹席長袖善留客緑耀尅碧雕琯笙朱脣玉指學鳯鳴流速參差飛且停飛且停在鳯樓弄嬌響間清謳採菱曲古今樂録曰採菱曲和云菱歌女解佩戲江陽江南稚女珠腕繩金翠搖首紅顔興桂棹容歌歌採菱歌採菱心未怡翳羅袖望所思遊女曲古今樂録曰遊女曲和云當年少歌舞承酒笑氛氲蘭麝體芳滑容色玉耀眉如月珠佩婐􅛭戲金闕戲金闕遊紫庭舞飛閣歌長生朝雲曲古今樂録曰朝雲曲和云徙倚折耀華宋玉高唐賦序曰楚襄王與宋玉遊雲夢之臺望高唐之觀獨有雲氣變化無窮王問玉曰此何氣也玉曰所謂朝雲者也王曰何謂朝雲玉曰昔者先王嘗遊高唐怠而晝寢夢見一婦人曰妾巫山之女也為高唐之客聞君遊高唐願薦枕席王因幸之去而辭曰妾在巫山之陽高丘之阻旦為朝雲暮為行雨朝朝暮暮陽臺之下旦朝視之如言故為立廟號曰朝雲酈道元水經注曰巫山者帝女居焉宋玉謂帝之季女名曰瑶姫末行而亡封于巫山之臺精魂為草實謂靈芝所謂巫山之女高唐之姫也朝雲曲蓋取於此張樂陽臺歌上謁如寢如興芳暗曖容光既豔復還沒復還沒望不來巫山高心徘徊趙瑟曲梁沈約邯鄲竒弄出文梓縈弦急調切流徴玄鶴徘徊白雲起白雲起鬱披香離復合曲未央秦筝曲羅袖飄纚拂雕桐促柱髙張散輕宫迎歌度舞遏歸風遏歸風止流月壽萬春歡無歇陽春曲劉向新序宋玉對楚威王問曰客有歌於郢中為者其始曰下里巴人國中屬而和者數千人其陽陵採薇國中屬而和者數百人其為陽春白雪國中屬而和者數十人而已也引商刻角雜以流徴國中屬而和者不過數人是以其曲彌高其和彌寡然則陽春所從來亦逺矣樂府解題曰陽春傷也楊柳垂地鷲差池緘情忍思落容儀弦傷曲怨心自知心自知人不見動羅裙拂珠殿採菱歌宋鮑照騖舲馳桂浦息棹偃椒潭簫弄澄湘北菱歌淸漢南梁簡文帝菱花落復含桑女罷新蠶桂棹浮星艇徘徊蓮葉南古樂府卷七
