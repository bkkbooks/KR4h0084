body:
  text: 古樂府卷三元左克明撰橫吹曲歌辭橫吹曲其始亦謂之鼓吹馬上奏之乃軍中之樂也自漢已來北狄樂總歸鼓吹署其後分為二部有簫笳者為鼓吹用之朝㑹道路有鼓角者為橫吹用之軍中馬上所奏者是也晉書樂志曰橫吹有鼓角又有胡角即胡樂也漢張騫入西域傳其法於西京唯得摩訶兜勒一曲李延年因胡曲更造新聲二十八解魏晉以來唯傳十曲一曰黃鵠二曰隴頭三曰出關四曰入關五曰出塞六曰入塞七曰折楊栁八曰黃覃子九曰赤之楊十曰望行人後有關山月洛陽道長安道梅花落紫騮馬驄馬雨雪劉生八曲合十八曲古辭間有存者今取六朝諸詩列於後以備觀覽云隴頭陳後主一曰隴頭水通典曰天水郡有大阪名曰隴坻亦曰隴山即漢隴關也三秦記曰其阪九回上者七日乃越上有清水四注下所謂隴頭水也隴頭征戍客寒多不識春驚風起嘶馬若霧雜飛塵投錢積石水斂轡交河津四面夕冰合萬里望佳人隴頭水梁元帝銜悲别隴頭關路漫悠悠故鄉迷逺近征人分去留沙飛曉成幕海氣旦如樓欲識秦川處隴水向東流出關唐魏徴中原還逐鹿投筆事戎軒縱橫計不就慷慨志猶存䇿杖謁天子驅馬出關門請纓羈南越憑軾下東藩鬱紆陟髙岫出沒望中原古木吟寒鳥空山啼夜猿既傷千里目還驚九折魂豈不憚艱險深懷國士恩季布無二諾侯嬴重一言人生感意氣功名誰復論入關梁吳均羽檄起邉庭烽火亂如螢是時張博望夜赴交河城馬頭要落日劒尾掣流星君恩未得報何論身命傾出塞古辭晉書樂志曰出塞入塞曲李延年造曹嘉之晉書曰劉疇嘗避亂塢壁賈胡百數欲害之疇無懼色援笳而吹之為出塞入塞之聲以動其遊客之思於是其衆皆垂淚而去按西京雜記曰戚夫人善歌出塞入塞望歸之曲則高帝時已有之疑不起於延年也唐又有塞上塞下曲蓋出於此候騎出井泉奔命入居延旗作浮雲影陳如明月弦入塞周王裒戍久風塵色勳多意氣豪建章樓閣逈長安陵樹髙度氷傷馬骨經寒墜節旄行當見天子無假用錢刀折楊栁梁元帝梁樂府有胡吹歌云上馬不捉鞭反拗楊栁枝下馬吹橫笛愁殺行客兒此歌辭元出北國即鼓角橫吹曲折楊柳是也宋書五行志曰晉太康末京洛為折楊柳之歌其曲有兵革苦辛之辭山髙巫峽長垂栁復垂楊同心且同折故人懷故鄉山似蓮花艷流如明月光寒夜猿聲徹遊子淚霑裳關山月梁元帝此言傷別離也按相和曲有度關山亦類此也朝望清波道夜上白登臺月中含桂樹流影自徘徊寒沙逐風起春花犯雪開夜長無與晤衣單誰為裁洛陽道梁元帝洛陽開大道城北達城西青槐隨幔拂緑栁逐風低玉珂鳴戰馬金爪鬪場雞桑萎日行暮多逄秦氏妻長安道神臯開隴右陸海實西秦金槌抵長樂復道向宜春落花依度幰垂栁拂行人金張及許史夜夜尚留賔梅花落宋鮑照梅花落本笛中曲也按唐大角曲亦有大單于小單于大梅花小梅花等曲今其聲猶有存者中庭雜樹多偏為梅咨嗟問君何獨然念其霜中能作花露中能作實搖蕩春風媚春日念爾零落逐風飈徒有霜花無霜質紫騮馬梁簡文帝古今樂録曰紫騮馬古辭云十五從軍征八十始得歸道逄鄉裏人家中有阿誰又梁曲曰獨柯不成樹獨樹不成林念娘錦裲襠恆長不忘心蓋從軍久戍懷歸而作也賤妾朝下機正值良人歸青絲懸玉鐙朱汗染香衣驟急珂彌響􅘠多塵亂飛雕菰幸可薦故心君莫違梁元帝長安美少年金絡錦連錢宛轉青絲鞚照耀珊瑚鞭驄馬梁車􅛴一曰驄馬驅皆言關塞征役之事驄馬鏤金鞍柘彈落金丸意欲驂驔走先作野遊盤平明發下蔡日中過上蘭路逺行須疾非是畏人看驄馬驅梁元帝朔方寒氣重胡關饒苦霧白雪晝凝山黃雲宿埋樹連翩行役子終朝征馬度試上金微山還看玉關路雨雪陳後主采薇詩曰昔我往矣楊栁依依今我來思雨雪霏霏穆天子傳曰天子遊黃臺之丘獵于平澤有降雨天子乃休日中大寒北風雨雪有凍人天子作詩三章以哀之曰我徂黃竹是也雨雪曲蓋取諸此長城飛雪下邊關地籟吟濛濛九天暗霏霏千里深樹冷月恆少山霧日偏沉况聽南歸鴈切思哀笳音劉生梁元帝劉生不知何代人觀齊梁以來所為劉生之辭者皆稱其任俠豪放周遊五陵三秦之地或云抱劒專征為符節官所未詳也遊俠有劉生然諾重西京扶風好驚坐長安恆借名榴花聊夜飲竹葉解朝酲結交李都尉遨遊佳麗城梁鼓角橫吹曲樂録云梁鼓角橫吹曲有企喻琅琊王巨鹿公主紫騮馬黃淡思地驅樂雀勞利慕容垂隴頭流水等歌三十六曲此九曲有歌其二十五曲有歌有聲樂府胡吹舊曲有十四篇唯淳于王捉搦東平劉生有歌其十一曲並亡又有隔谷折楊栁幽州馬客吟慕容家自魯企由谷隴頭高陽王樂人等歌古辭並存唯木蘭二曲不知起於何代也企喻歌古辭企喻本北歌梁鼓角橫吹曲有四曲後一曲乃符融作之深山解谷口白骨無人收與今傳者小異男兒欲作健結伴不須多鷂子經天飛羣雀兩向波放馬大澤中草好馬著臕牌子鐡裲襠鉉鉾鶴尾條前行看後行齊著鐡裲襠前頭看後頭齊著鐡鉉鉾男兒可憐蟲出門懷死憂尸喪狹谷中白骨無人收琅琊王歌古今樂録曰琅琊王歌八曲或云隂凉下又有二句云盛冬十一月就女覔凍漿最後云誰能騎此馬唯有廣平公按晉書載記廣平公姚弼興之子泓之弟也新買五尺刀懸著中梁柱一日三摩挲劇於十五女琅琊復琅琊琅琊大道王陽春二三月單衫繡裲襠東山看西水水流盤石間公死姥更嫁孤兒甚可憐琅琊復琅琊琅琊大道王鹿鳴思長草愁人思故鄉長安十二門光門最妍雅渭水從壟來浮游渭橋下琅琊復琅琊女郎大道王孟陽三四月移鋪逐隂凉客行依主人願得主人彊猛虎依深山願得松柏長快馬髙纒鬃遙知身是龍誰能騎此馬唯有廣平公巨鹿公主歌唐書樂志曰梁有巨鹿公主歌似是姚萇時歌其詞華音與此歌不同官家出遊雷大鼓細乘犢車開後户車前女子年十五手彈琵琶玉節舞巨鹿公主殷照女皇帝陛下萬幾主紫騮馬歌古今樂録曰十五從軍征以下是古詩燒火燒野田野鴨飛上天童男娶寡婦壯女笑殺人髙髙山頭樹風吹葉落去一去數千里何當還故處十五從軍征八十始得歸道逄鄉里人家中有阿誰遙看是君家松柏冢纍纍兔從狗竇入雉從梁上飛中庭生旅穀井上生旅葵舂穀持作飯採葵持作羮羮飯一時熟不知飴阿誰出門東向看淚落沾我衣黃淡思歌古今樂録曰思音相思之思按李延年造橫吹曲二十八解有黃覃子不知與此同否歸歸黃淡思逐郎還去來歸歸黃淡百逐郎何處索心中不能言腹作車輪旋與郎相知時但恐傍人聞江外何鬱拂龍洲廣州出象牙作帆檣緑絲作幃繂緑絲何葳蕤逐郎還去來地驅樂歌古今樂録曰側側力力以下八句是今歌有此曲最後云不可與力或云各自努力青青黃黃雀石穨唐槌殺野牛押殺野羊驅羊入谷自羊在前老女不嫁踏地喚天側側力力念君無極枕郎左臂隨郎轉側摩捋郎鬚看郎顔色郎不念女不可與力月明光光星露墮欲來不來早語我今按此非地驅樂歌不知左氏何以附此雀勞利歌雨雪霏霏雀勞利長觜飽滿短觜饑慕容垂歌晉書載記曰慕容垂本名缺尋以䜟記乃去夬以垂為名慕容雋僣號封垂為吳王徙鎮信都太元八年自稱燕王慕容攀墻視吳軍無邉岸我身分自當枉殺墻外漢慕容愁憤憤燒香作佛會願作墻裏燕髙飛出墻外慕容出墻望吳軍無邉岸咄我臣諸佐此事可惋歎隴頭流水歌古今樂録曰樂府有此歌曲解多於此隴頭流水流離西下念吾一身飄然曠野西上隴坂羊腸九回山高谷深不覺腳酸手攀弱枝足踰弱泥隔谷歌古今樂録曰前云無辭樂工有辭如此兄在城中弟在外弓無弦箭無括食糧乏盡若為活救我來救我來兄為俘虜受困辱骨露力疲食不足弟為官吏馬食粟何惜錢刀來我贖淳于王歌肅肅河中育育熟須含黃獨坐空房中思我百媚郎百媚在城外千媚在中央但使心相念髙城何所妨東平劉生歌東平劉生安東子樹木稀屋裏無人看阿誰捉搦歌粟穀難舂付石臼弊衣難護付巧婦男兒千凶飽人手老女不嫁只生口誰家女子能行步反著夾禪後裙露天生男女共一處願得兩箇成翁嫗華隂山頭百丈井下有流水徹骨泠可憐女子能照影不見其餘見斜領黃桑柘屐蒲子履中央有絲兩頭繫小時憐母大憐壻何不早嫁論家計折楊栁歌舊本五解後又有三解非也乃別曲耳凡四解今附於後上馬不捉鞭反拗楊柳枝下馬吹長笛愁殺行客兒腹中愁不樂願作郎馬鞭出入擐郎臂蹀座郎膝邉放馬兩泉澤忘不著連羈擔鞍逐馬走何見得馬騎遙看孟津河楊柳鬱婆娑我是虜家兒不解漢兒歌健兒須快馬快馬須健兒䟤跋黃塵下然後別雄雌上馬不捉鞭反拗楊栁枝下馬吹長笛愁殺行客兒門前一株棗歲歲不知老阿婆不嫁女那得孫兒抱敕敕何力力女子臨窗織不聞機杼聲唯聞女嘆息問女何所思問女何所憶阿婆許嫁女今年無消息幽州馬客吟歌快馬常苦瘦勦兒常苦貧黃禾起羸馬有錢始作人熒熒帳中燭燭滅不久停盛時不作樂春花不重生南山自言髙只與北山齊女兒自言好故入郎君懷郎著紫袴褶女著綵夾裙男女共燕遊黃花生後園黃花鬱金色緑蛇銜珠丹辭謝牀上女還我十指鐶慕容家自魯企由谷歌郎在十重樓女在九重閣郎非黃鷂子那得雲中雀隴頭歌隴頭流水鳴聲幽咽遙望秦川心肝斷絶朝發欣城暮宿隴頭寒不能語舌卷入喉高陽樂人歌古今樂録曰魏高陽王樂人所作也乂曰白鼻騧蓋出於此可憐白鼻騧相將入酒家無錢但共飲畫地作交賖何處諜傷來兩頰色如火自有桃花容莫言人勸我白鼻騧後魏溫子升少年多好事攬轡向西都相逢俠斜路駐馬詣當壚木蘭辭古辭木蘭不知名詐作男子代父征行其辭最苦言萬里赴戎機關山度若飛朔氣傳金柝寒光照鐡衣相和曲有度關山亦類此皆言傷別之意唧唧復唧唧一作促織木蘭當户織不聞機杼聲唯聞女嘆息問女何所思問女何所憶女亦無所思女亦無所憶昨夜見軍帖可汗大㸃兵軍書十二卷卷卷有爺名阿爺無大兒木蘭無長兄願為市鞍馬從此替爺征東市買駿馬西市買鞍韉南市買轡頭北市買長鞭旦一作朝字辭爺娘去暮宿黃河邉不聞爺娘喚女聲但聞黃河流水鳴濺濺旦辭黃河去暮至一作宿黑山頭不聞爺娘喚女聲但聞燕山胡騎鳴啾啾萬里赴戎機關山度若飛朔氣傳金柝寒光照鐡衣將軍百戰死壯士十年歸歸來見天子天子坐明堂䇿勳十二轉賞賜百千彊可汗問所欲木蘭不用尚書郎一作欲與木蘭賞不願尚書郎願馳千里足段成式酉陽雜爼云願借明駝千里足送兒還故鄉爺娘聞女來出郭相扶將阿妹聞姊來當戶理紅粧小弟聞姊來磨刀霍霍向豬羊開我東閣門坐我西間床脫我戰時袍著我舊時裳當窗理雲鬢挂鏡貼花黃出門看火伴火伴皆驚一作始字忙同行十二年不知木蘭是女郎雄兔腳撲朔雌兔眼迷離雙一作兩兔傍地走安能辨我是雄雌木蘭抱杼嗟借問復為誰欲聞所戚戚感激彊其顔老父𨽻兵籍氣力日衰耗豈足萬里行有子復尚少胡沙沒馬足朔風裂人膚老父舊羸病何以彊自扶本蘭代父去秣馬備戎行易却紈綺裳洗却鉛粉妝馳馬赴軍幕慷慨携干將朝屯雪山下暮宿青海傍夜襲月支虜更携于闐羌將軍得勝歸士卒還故鄉父母見木蘭喜極成悲傷木蘭能承父母顔却卸巾鞲理絲簧昔為烈士雄今復嬌子容親戚持酒賀父母始知生女與男同門前舊軍都十年共﨑嶇本結兄弟交死戰誓不渝今也見木蘭言聲雖是顔貌殊驚愕不敢前歎重徒嘻吁世有臣子心能如木蘭節忠孝兩不渝千古之名焉可滅古樂府卷三
