body:
  text: 古樂府卷七元左克明撰淸商曲歌辭下西曲歌石城樂古辭唐書樂志曰石城樂者宋臧質所作也石城在竟陵質嘗爲竟陵郡於城上眺瞩見羣少年歌謡通暢因作此曲生長石城下開窓對城樓城中諸少年出入見衣投陽春百花生摘挿環髻前捥指蹋㤀愁相與及盛年布㠶百餘幅環環在江津執手雙淚落何時見歡還大艑載三千漸水丈五餘水高不得渡與歡合生居聞歡遠行去相送方山亭風吹黃蘖萎惡聞苦離聲烏夜啼古辭唐書樂志曰烏夜啼者宋臨川王義慶所作也元嘉十七年徙彭城王義康於豫章義慶時爲江州至鎭相見而哭文帝聞而恠之徴還慶大懼伎妾夜聞烏啼聲扣齋閤云明日應有赦其年更爲南兖州刺史因作此歌故其和云夜夜朢郎來籠窻窻不開今所傳歌辭似非義慶本音歌舞諸少年娉婷無種迹菖蒲花可憐聞名不曾識長檣鉄鹿子布㠶阿那起詫儂安在間一去數千里辭家遠行去儂歡獨離居此日無啼音裂帛作還書可憐烏臼鳥彊言知天曙無故三更啼歡子冒闇去烏生知欲飛飛飛各自去生離無安心夜啼至天曙籠窻窻不開蕩户户不動歡下葳蕤籥交儂那得徃遠朢千里煙隱當在歡家欲飛無兩翅當奈獨思何巴陵三江口蘆荻齊如麻執手與歡别痛切當奈何梁簡文帝緑草庭中朢明月碧玉堂裏對金鋪鳴弦撥捩發初異挑琴欲吹衆曲殊不疑三足朝含影直言九子夜相呼羞言獨眠枕下流託道單棲城上烏烏棲曲梁簡文帝芙蓉作船絲作䋏北斗横天月將落採蓮渡頭擬黃河郎今欲渡畏風波浮雲似帳月如鈎那能夜夜南陌頭宜城投泊今行熟停鞍繫馬暫棲宿靑牛丹轂七香車可憐今夜宿倡家倡家高樹烏欲棲羅幃翠被任君低織成屏風金屈膝朱脣玉面燈前岀相看氣息朢君憐誰能含羞不自前梁元帝沙棠作舩桂爲檝夜渡江南採蓮葉復值西施新浣沙共向江干眺月蕐梁蕭子顯芳樹歸飛聚儔匹猶有殘光半山日莫憚褰裳不相求漢臯遊女習風流徐陵繡帳羅幃隱燈燭一夜千年猶不足唯憎無頼汝南雞天河未落猶爭啼棲烏曲陳後主陌頭新花歴亂生葉裏啼烏送春情長安遊俠無數伴白馬驪珂路中滿合歡襦薫百和香牀中被織兩鴛鴦烏啼漢没天應曙只持懷抱送郎去陳江緫桃花春水木蘭橈金覊翠盖聚河橋隴西上計應行去城南美人啼著曙估客樂齊武帝古今樂錄曰估客樂者齊武帝之所製也帝布衣時甞遊樊鄧登祚以後追憶徃事而作歌使太樂令劉瑶管弦被之教習卒遂無成有人啓釋寳月善解音律帝使奏之旬日之中便就諧合敕歌者常重爲感憶之聲猶行於世寳月又上兩曲帝數乘龍舟遊五城江中放觀以紅越布爲㠶綠絲爲㠶繂鍮石爲篙足篙榜者悉著鬰林布作淡黃袴列開使江中衣岀五城殿猶在齊舞十六人梁八人唐書樂志曰梁改其名爲商旅行昔經樊鄧役阻潮梅根渚感憶追徃事意滿情不敘齊釋寳月郎作十里行儂作九里送拔儂頭上釵與郎資路用有信數寄書無信心相憶莫作甁落井一去無消息大艑珂峩頭何處發揚州借問艑上郎見儂所歡不初發揚州時船岀平津泊五兩如竹林何處相尋慱陳後主三江結儔侣萬里不辭遥恒隨鷁􅈡舫屢逐鷄鳴潮莫愁樂古辭唐書樂志曰莫愁樂者岀於石城樂石城有女子名莫愁善歌謠石城樂和中復有莫愁聲因有此歌古今樂錄曰莫愁樂亦云蛮樂舊舞十六人梁八人樂府解題曰古歌亦有莫愁洛陽女與此不同莫愁在何處莫愁石城西艇子打兩槳催送莫愁來聞懽下揚州相送楚山頭探手抱腰看江水斷不流襄陽樂古辭古今樂錄曰襄陽樂者宋隋王誕之所作也誕始爲襄陽郡元嘉二十六年仍爲雍州刺史夜聞諸女歌謡因而作之所以歌和中有襄陽來夜樂之語也朝發襄陽城暮至大堤宿大堤諸女兒花豔驚郎目爛漫女蘿草結曲繞長松三春雖同色歲寒非處儂黃鵠參天飛中道鬰徘徊腹中車輪轉歡今定憐誰揚州蒲鍜環百錢兩三叢不能買將還空手攬抱儂女蘿自微薄寄託長松表何惜負霜死貴得相纒繞惡見多情歡罷儂不相語莫作烏集林忽如提儂去三洲歌古辭唐書樂志曰三洲商人歌也古今樂錄曰三洲歌者商客數遊巴陵三江口徃還因共作此歌送歡板橋灣相待三山頭遥見千幅㠶知是逐風流風流不暫停三山隱行舟願作比目魚隨歡千里遊湘東酃醁酒廣州龍頭鐺玉樽金鏤椀與郎雙杯行陳後主春江聊一朢細草遍長洲沙汀時起伏畫舸屢淹留襄陽蹋銅蹄梁武帝隋書樂志曰梁武帝之在雍鎭有童謡云襄陽蹋銅蹄反縛揚州兒識者言白銅蹄謂金蹄爲馬也白金色也及義師之興實以鐡騎揚州之士皆面縛果如謡言故卽位之後更造新聲帝自爲之詞三曲又令沈約爲三曲以被管弦古今樂錄曰襄陽蹋銅蹄者梁武西下所製也沈約又作其和云襄陽白銅蹄聖徳應乾來陌頭征人去閨中女下機含情不能言送别沾羅衣草樹非一香花葉百種色寄語故情人知我心相憶龍門紫金鞍翠眊白玉羈照耀雙闕下知是襄陽兒梁沈約分手桃林岸朢别峴山頭若欲寄音信漢水向東流生長宛水上從事襄陽城一朝遇神武奮翼起先鳴蹀鞚飛塵起左右自生光男兒得富貴何必在歸鄕採桑度古辭採桑度一曰採桑唐書樂志曰採桑因三洲曲而生此聲調也採桑度梁時作水經曰河水過屈縣西南爲採桑津春秋僖公八年晉里克敗狄於採桑是也蠶生春三月春桑正含綠女兒採春桑歌吹當春曲冶遊採桑女盡有芳春色姿容應春媚粉黛不加餙繫條採春桑採葉何紛紛採桑不裝鈎牽壊紫羅裙語歡稍養蠶一頭養百塸柰當黒痩盡桑葉常不周春月採桑時林下與歡俱養蠶不滿百那得羅繡襦採桑盛陽月緑葉何翩翩攀條上樹表牽壞紫羅裙僞蠶化作繭爛漫不成絲徒勞無所獲養蠶特底爲江陵樂古辭陽春二三月相將蹋百草逢人駐歩㸔揚聲皆言好青陽度古今樂錄曰青陽度倚歌凢倚歌悉用鈴皷無弦有吹青荷盖綠水芙蓉披紅鮮下有幷根藕上生幷頭蓮青騘白馬青絲白馬紫絲韁可憐石橋根柏梁汝忽千里去無常願得到頭還故鄕繫馬可憐著長松遊戱徘徊五湖中借問湖中採菱婦蓮子青荷可得否可憐白馬高纒騣著地躑躅多徘徊問君可憐六萌車迎取窈窕西曲娘問君可憐下都去何得見君復西歸齊唱可憐使人惑晝夜懐歡何時㤀共戱樂齊世方昌書軌同萬㝢獻樂列國風時泰民康人物盛腰鼔鈴柈各相競長袖翩翩若鴻驚纎腰嫋嫋㑹人情觀風採樂德化昌聖皇萬壽樂未央安東平凄凄烈烈北風爲雪船道不通歩道斷絶吳中細布闊幅長度我有一端與郎作袴微物雖輕拙手所作餘有三丈爲郎別厝制爲輕巾以奉故人不特作好與郎拭塵東平劉生復感人情與郎相知當解千齡女兒子古今樂錄曰女兒子已下幷倚歌也巴東三峽猿鳴悲夜鳴三聲淚沾衣我欲上蜀蜀水難蹋蹀珂頭腰環環來羅鬰金黃花標下有同心草草生日已長人生日就老君子防未然莫近嫌疑邉𤓰田不躡履李下不正冠白頭不忍死心愁皆敖然遊戱泰始世一日當千年那呵灘㳂江引百丈一濡多一艇水上郎檐篙何時至江陵聞歡下揚州相送江津彎願得篙檐折交郎到頭還孟珠陽春二三月草與水同色攀條摘香花言是歡氣息陽春二三月草與水同色道逢遊冶郎恨不早相識翳樂人生歡愛時少年新得意一旦不相見輙作煩寃思陽春二三月相將舞翳樂曲曲隨時變特許豔郎目人言揚州樂揚州信自樂總角諸少年歌舞自相逐夜黃湖中百種鳥半雌半是雄鴛鴦逐野鴨恐畏不成雙夜度娘夜來冒霜雪晨去履風波雖得叙微情奈儂身苦何長松標落落千丈松晝夜對長風歲暮霜雪時寒苦與誰雙雙行纒朱絲繫腕繩眞如白雪凝非但我言好衆情共所稱黃督喬客他鄕人三春不得歸願㸔楊柳樹已復藏班鵻平西樂我情與歡情二情感蒼天形雖胡越隔神交中夜間白附鳩石頭龍尾彎新亭送客渚酤酒不取錢郎能飲幾許㧞蒲青蒲衘紫茸長葉復從風與君同舟去㧞蒲五湖中朝發桂蘭渚晝息桑榆下與君同㧞蒲竟日不成把壽陽樂可憐八公山在壽陽別後莫相㤀東臺百餘尺凌風雲别後不忘君梁長曲水流明如鏡雙林與郎照辭家遠行去空爲君明知歲月駛作蠶絲春蠶不應老晝夜常懷絲何惜微軀盡纒綿自有時素絲非常質屈折成綺羅敢辭機杼勞但恐花色多楊叛兒唐書樂志曰楊叛兒本童謡歌也齊隆昌時女巫之子曰楊旻少時隨母入内及長爲何后寵童謡云楊婆兒共戯来而歌語訛遂成楊伴兒古今樂錄曰楊叛兒送聲云叛兒教儂不復相思蹔岀白門前楊柳可藏烏歡作沈水香儂作慱山鑪送郎乘艇子不作遭風慮橫篙擲去槳願倒逐流去歡欲見蓮時移湖安屋裏芙蓉繞林生眠卧抱蓮子楊叛西隨曲柳花經東隂風流隨遠近飄揚悶儂心西烏夜飛古辭古今樂錄曰西烏夜飛者宋元徽五年荆州刺史沈攸之所作也攸之舉兵發荆州東土未敗之前思歸京師所以歌和云白日落西山還去來送聲云折趐鳥飛何處被彈歸陽春二三月諸花盡芳盛特底喚歡來花笑鶯歌詠感郎﨑嶇情不復自顧慮臂繩雙入結遂成同心去月節折楊柳歌古辭正月歌春風尚蕭條去故來入新苦心非一朝折楊柳愁思滿腹中歴亂不可數二月歌翩翩烏入鄕道逢雙燕飛勞君㸔三陽折楊柳寄言語儂歡尋還不復乆三月歌汎舟臨曲池仰頭㸔春花杜䳌緯林啼折楊柳雙下俱徘徊我與歡共取四月歌芙蓉始懷蓮何處覔同心俱生世尊前折楊柳捻香散名花志得長相取五月歌菰生四五尺素身爲誰珍盛年將可惜折楊柳作得九子粽思想勞歡手六月歌三伏熱如火籠窻開北牖與郎對蹋坐折楊柳銅塸貯蜜漿不用水洗溴七月歌織女遊河邉牽牛顧自歡一㑹復周年折楊柳攬結長命草同心不相負八月歌迎歡裁衣裳日月流如水白露凝庭霜折楊柳夜聞擣衣聲窈窕誰家婦九月歌丼菊吐黃花非無盃觴用當奈許寒何折楊柳授歡羅衣裳含笑言不取十月歌大樹轉蕭索天隂不作雨嚴霜半夜落折楊柳林中與松栢歲寒不相負十一月歌素雪任風流樹木轉枯悴松栢無所憂折楊柳寒衣履薄氷歡詎知儂否十二月歌大寒歲欲暮春秋及冬夏苦心停欲度折楊柳沈亂枕席間纒綿不覺乆閏月歌成閏暑與寒春秋補小月念子無時閒折楊柳隂陽推我去那得有定主江南弄梁武帝古今樂録曰江南弄三洲韻和云陽春路娉婷岀綺羅衆花雜色滿上林舒芳燿緑垂輕隂連手􅉜蹀舞春心舞春心臨歲腴中人朢獨踟蹰龍笛曲古今樂錄曰龍笛曲和云江南音一唱直千金馬融長笛賦曰近世雙笛從羌起羌人伐竹未及巳龍鳴水中不見已截竹吹之聲相似然則龍笛曲盖因聲如龍鳴而名曲美人綿眇在雲堂雕金鏤竹眠玉床婉愛寥亮繞虹梁繞虹梁流月臺駐狂風鬰徘徊採蓮曲古今樂錄曰採蓮曲和云採蓮渚窈窕舞佳人遊戱五湖採蓮歸發花田葉芳襲衣爲君儂歌世所希世所希有如玉江南弄採蓮曲鳯笙曲古今樂錄曰鳯笙曲和云弦吹席長䄂善留客綠耀尅碧彫琯笙朱脣玉指學鳯鳴流速參差飛且停飛且停在鳯樓弄嬌響間清謳採菱曲古今樂錄曰採菱曲和云菱歌女解佩戯江陽江南稚女珠腕繩金翠搖首紅顔興桂棹容歌歌採菱歌採菱心未怡翳羅䄂朢所思遊女曲古今樂錄曰遊女曲和云當年少歌舞承酒笑氛氲蘭麝體芳滑容色玉耀眉如月珠佩婐􅛭戯金闕戯金闕遊紫庭舞飛閣歌長生朝雲曲古今樂錄曰朝雲曲和云徙倚折耀華宋玉高唐賦序曰楚襄王與宋玉遊雲夢之臺朢高唐之觀獨有雲氣變化無窮王問玉曰此何氣也玉曰所謂朝雲者也王曰何謂朝雲玉曰昔者先王嘗遊高唐怠而晝寢夢見一婦人曰妾巫山之女也爲高唐之客聞君遊高唐願薦枕席王因幸之去而辭曰妾在巫山之陽高丘之阻旦爲朝雲暮爲行雨朝朝暮暮陽臺之下旦朝視之如言故爲立廟號曰朝雲酈道元水經注曰巫山者帝女居焉宋玉謂帝之季女名曰瑶姫末行而亡封于巫山之臺精魂爲草實謂靈芝所謂巫山之女高唐之姫也朝雲曲盖取於此張樂陽臺歌上謁如寢如興芳晻曖容光旣豔復還没復還没朢不來巫山高心徘徊趙瑟曲梁沈約邯鄲竒弄岀文梓縈弦急調切流徴𤣥鶴徘徊白雲起白雲起鬰披香離復合曲未央秦筝曲羅䄂飄纚拂雕桐促柱髙張散輕宫迎歌度舞遏歸風遏歸風止流月壽萬春歡無歇陽春曲劉向新序宋玉對楚威王問曰客有歌於郢中為者其始曰下里巴人國中屬而和者數千人其陽陵採薇國中屬而和者數百人其爲陽春白雪國中屬而和者數十人而已也引商刻角雜以流徴國中屬而和者不過數人是以其曲彌高其和彌寡然則陽春所從來亦逺矣樂府解題曰陽春傷也楊柳垂地鷲差池緘情忍思落容儀弦傷曲怨心自知心自知人不見動羅裙拂珠殿採菱歌宋鮑照騖舲馳桂浦息棹偃椒潭簫弄澄湘北菱歌淸漢南梁簡文帝菱花落復含桑女罷新蠶桂棹浮星艇徘徊蓮葉南古樂府巻七
