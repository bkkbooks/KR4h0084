body:
  text: 古樂府總集類提要臣等謹案古樂府十巻元左克明編克明自稱豫章人其始末未詳自序題至正丙戌則順帝時也是書錄古樂府詞分為八類曰古歌謡曰鼓吹曲曰横吹曲曰相和曲曰清商曲曰舞曲曰琴曲曰襍曲自序謂冠以古歌謡詞者貴其發乎自然終以襍曲者著其漸流于新聲又謂風化日移繁音日滋懼乎此聲之不作也故不自量度推本三代而上下止陳隋截然獨以為宗雖獲罪世之君子無所逃焉云云當元之季楊維禎以工為樂府傾動一時其體務造恢竒無復舊格克明此論其為維楨而發乎考宋郭茂倩先有樂府詩集所錄止于唐末極為賅備克明此集似乎牀上之牀然考李孝光刻樂府詩集序稱其書歳久將弗傳至元六年濟南彭叔儀始得本校刻是郭書刋板之時僅在克明成書前六年其板又在濟南距江西頗逺則編此集時當必未見郭書非相蹈襲且郭書務窮其流故所收頗濫如薛道衡昔昔鹽凡二十句唐趙嘏每句賦詩一首此殆如春官程試摘句命題本無關於樂府乃列之薛詩之後未免不倫此集務溯其源故所重在于方題古詞而變體擬作則去取頗慎其用意亦逈不同也每類各有小序核其詞氣確為克明自作其題下夾註則多摭樂府詩集之文紫玉歌條下並明標樂府詩集字今考其臨髙臺條下引劉履風雅翼之説尚與克明相去不逺至紫騮馬條下引馮惟訥詩紀之説則嘉靖中書元人何自見之其由明人重刻臆為竄入明矣乂馮舒校玉臺新詠于焦仲卿妻詩守節情不移句下註曰按活本楊本此句下有賤妾留空房相見常日稀二句檢郭左二樂府並無之今考此本乃已有此二句知正文亦為重刻所改不止私增其解題矣然元刻今未之見無由互校刋除姑仍明刻錄之而附訂其謬如右乾隆四十六年正月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀古樂府原序漢武帝立樂府官采詩以四方之聲合八音之調用之甘泉圜丘此樂府之名所由始也厯世相承古樂廢缺雖修舉不常而日就泯沒博洽推究師授莫明於是凡其諸樂舞之有曲與夫歌辭可以被之管絃者通其前後俱謂之樂府上追三代下逮六朝作者迭興倣效繼出雖世降不同而時變可考紛紛沿襲古意略存或因意命題或學古敘事尚能原閨門袵席之遺而達於朝廷宗廟之上方三百篇之詩為近而下視後世詞章留連光景者有間矣克明竊伏山林有志兹事見聞淺鮮終不克成數年以來勉强就緒採摭前人之餘意探求作者之異同按名分類刪繁舉要唐人祖述尚多非敢棄置葢世傳者衆弗頼於斯是編也謂之古樂府故獨詳於古焉記曰凡樂樂其所自生愚之管見亦欲世之作者泝流窮原而不失其本㫖云耳其為卷也凡十而其為類也八冠以古歌謠辭者貴其發乎自然也終以雜曲者著其漸流於新聲也嗚呼樂府之流傳也尚矣風化日移繁音日滋愚懼乎此聲之不作也故不自量度輒為敘次推本三代而上下止陳隋截然獨以為宗雖獲罪世之君子無所逃焉至正丙戌良月豫章後學左克明序
