body:
  text: 古樂府卷八元左克明撰舞曲歌辭周有六舞一曰帗舞二曰羽舞三曰皇舞四曰旄舞五曰干舞六曰人舞周官舞師掌教四舞樂師掌教國子小舞自漢魏以後樂舞䆮盛故有雅舞有雜舞雅舞用之郊廟朝饗雜舞用之宴會雜舞者公莫巴渝鐸舞拂舞白紵之類是也始皆出於方俗後䆮陳於殿庭蓋宴會所奏率非雅舞宋武帝大明中亦以雜舞施於廟庭朝會用樂則兼奏之而巴渝舞則漢高帝所作王粲改創其辭以述魏德於太祖廟奏之而鐸舞巾舞古辭有聲而辭不可讀拂舞則有白鳩獨漉等曲白紵宜是吳舞本吳地所出也故列於舞曲云雜舞俞兒舞王粲晉書樂志曰巴渝舞漢高帝所作也高帝自蜀漢將定三秦閬中范因率賨人從帝為前鋒號板楯蠻勇而善鬬及定秦中封因為䦘中侯復賨人七姓其俗善歌舞高帝樂其猛鋭數觀其舞曰武王伐紂歌也後使樂人習之閬中有渝水因其所居故曰巴渝舞舞曲有矛渝弩渝安臺行辭本歌曲四篇其辭既古莫能曉其句度左思蜀都賦云奮之則賨旅玩之則渝舞也顔師古曰巴巴人也渝渝人也高祖初為漢王得巴渝人並趫捷與之滅椘因存其武樂巴渝之樂自此始也巴即今之巴州渝即今之渝州名各本其地宋書樂志曰魏俞兒舞歌四篇魏國初建所用使王粲改創其辭為矛渝弩俞安臺行辭新福歌曲行辭以述魏德後於太祖廟並作之黃初二年改曰昭武舞及晉又改曰宣武舞唐書樂志曰俞美也魏晉改其名梁復號巴渝隋文帝以非正典罷之漢初建國家匡九州蠻荆震服五刃三革休安不忘備武樂修宴我賔師敬用御天永樂無憂子孫受百福常與松喬遊蒸庶德莫不咸歡柔右矛俞新福歌材官選士劒弩錯陳應桴蹈節俯仰若神綏我武烈篤我淳仁自東自西莫不來賔右弩俞新福歌武功既定庶士咸綏樂陳我廣庭式宴賔與師昭文德宣武威平九有撫民黎荷天寵延壽尸千載莫我違右安臺新福歌神武用師士素厲仁恩廣覆猛節橫逝自古立功莫我𢎞大桓桓征四國爰及海裔漢國保長慶垂祚延萬世右行辭新福歌鐸舞雲門篇傅玄黃雲門唐咸池虞韶舞夏夏殷濩列代有五振鐸鳴金延大武清歌發唱形為主聲和八音協律吕身不虛動手不徒舉應節合度周有敘時奏宫角雜之以徵羽下饜衆目上從鐘鼓樂以移風與德禮相輔安有失其所晉拂舞白鳩篇樂志曰白符鳩舞出江南吳人所造其歌本云平平白符思我君惠集我金堂言白者金行符合也鳩亦合也符鳩雖異其義實同宋書樂志曰晉楊泓舞序云自到江南見白符舞或言白鳬鳩舞云有此來數十年矣察其辭旨乃是吳人患孫皓虐政思屬晉也晉辭曰翩翩白鳩載飛載鳴懷我君德來集君庭蓋晉人改其本歌云翩翩白鳩載飛載鳴懷我君德來集君庭白雀呈瑞素羽明鮮翔庭舞翼以應仁乾交交鳴鳩或丹或黃樂我君惠振羽來翔東壁餘光魚在江湖惠而不費敬我微軀䇿我良駟習我驅馳與君周旋樂道亡餘我心虛靜我志霑濡彈琴鼓瑟聊以自娛凌雲登臺浮遊太淸攀龍附鳯目望身輕獨漉篇獨漉一作獨祿南齊書樂志曰古辭明君曲後云勇安樂無慈不問凊與濁清與無時濁邪交與獨祿伎録曰求祿求祿淸白不濁淸白尚可貪汚殺我晉歌為鹿字占通用也疑是風刺之辭獨漉獨漉水深泥濁泥濁尚可水深殺我雍雍雙鴈遊戲田畔我欲射鴈念子孤散翩翩浮萍得風遙輕我心何合與之同並空牀低帷誰知無人夜衣錦繡誰別偽真刀鳴簫中倚牀無施父寃不報欲活何為猛虎班班遊戲山間虎欲齧人不避豪賢濟濟篇暢飛暢舞氣流芳追念三五大綺黃去失有時可行去來同時此未央時冉冉近桑榆但當飲酒為歡娛衰老逝有何期多憂耿耿內懷思淵池廣魚獨希願得黃浦衆所依恩感人世無比悲歌且舞無極已碣石篇觀滄海南齊書樂志曰碣石魏武帝辭晉以為碣石舞其歌四章一曰觀滄海二曰冬十月三曰上不同四曰龜雖壽樂府解題曰碣石篇晉樂奏魏武帝辭首章言東臨碣石見滄海之廣日月出入其中二章言農工畢而商賈往來三章言鄉土不同人性各異四章言老驥伏櫪志在千里烈士暮年壯心不已按相和大曲步出夏門行亦有碣石篇與此並同但曲前更有豔爾東臨碣石以觀滄海水何淡淡山島竦峙樹木藂生百草豐茂秋風蕭瑟洪波湧起日月之行若出其中星漢燦爛若出其裏幸甚至哉歌以詠志冬十月孟冬十月比月徘徊天氣肅淸繁霜霏霏鵾雞晨鳴鴈過南飛鷙鳥潛藏熊羆窟栖錢鏄一作縳停置農收積場逆旅整設以通賈商幸甚至哉歌以詠志土不同鄉土不同河朔隆寒流澌浮漂舟船行難錐不入地豐籟深奧水竭不流氷堅可蹈士隱者貧男俠輕非心常歎怨戚戚多悲幸甚至哉歌以詠志龜雖壽神龜雖壽猶有竟時騰蛇乘霧終為土灰老驥伏櫪志在千里烈士暮年壯心不已盈縮之期不但在天養怡之福可得永年幸甚至哉歌以詠志淮南王篇崔豹古今注曰淮南王淮南小山之所作也淮南王服食求仙遍禮方士遂與八公相擕俱去莫知所往小山之徒思戀不已乃作淮南王曲焉班固漢武帝故事曰淮南王安好神仙招方術之士能為雲雨百姓傳云淮南王得天子壽無極帝心惡之使覘王云能致仙人與共遊處變化無常又能隱形飛行服氣不食帝聞而喜欲受其道王不肯傳帝怒將誅焉王知之出令與羣臣因不知所之樂府解題曰古詞云淮南王自言尊實言安仙去淮南王自言尊百尺高樓與天連後園鑿井銀作牀金甁素綆汲寒漿汲寒漿飲少年少年窈窕何能賢揚聲悲歌音絶天我欲渡河河無梁願化雙黃鵠還故鄉還故鄉入故里徘徊故鄉苦身不已繁舞寄聲無不泰徘徊桑梓遊天外晉白紵舞歌古辭宋書樂志曰白紵舞按舞辭有巾袍之言紵本吳地所出宜是吳舞也晉俳歌云皎皎白緒節節為雙吳音呼緒為紵疑白緒即白紵也南齊書樂志曰白紵歌周處風土記云吳黃龍中童謡云行白者君追汝句驪馬後孫權征公孫淵浮海乘舶舶白也今歌和聲猶云行白紵焉樂府解題曰古詞盛稱舞者之美宜及芳時為樂其譽白紵曰質如輕雲色如銀製以為袍餘作巾袍以光軀巾拂塵唐書樂志曰梁武帝令沈約改其辭為四時白紵歌今中原有白紵曲辭旨與此全殊輕軀徐起何洋洋高舉兩手白鵠翔宛若龍轉乍低昻凝停善睞容儀光如推若引留且行隨世而變誠無方舞以盡神安可忘晉世方昌樂未央質如輕雲色如銀愛之遺誰贈佳人制以為袍餘作巾袍以光軀巾拂塵麗服在御會嘉賔醪醴盈樽美且淳淸歌徐舞降祗神四座歡樂胡可陳雙袂齊舉鸞鳯翔羅裾飄颻昭儀光趨步生姿進流芳鳴弦淸歌及三陽人生世間如電過樂時每少苦日多幸及良辰耀春華齊倡獻舞趙女歌羲和馳景逝不停春露未晞嚴霜零百草凋索花落英蟋蟀吟牖寒蟬鳴百年之命忽若傾早知迅速秉燭行東造扶桑遊紫庭西至崑崙戲曾城陽春白日風花香趨步明玉舞瑶璫聲發金石媚笙簧羅袿徐轉紅袖揚淸歌流響繞鳯梁如矜若思凝且翔轉盼遺精耀輝光將流將引雙鴈行歡來且晚意何長明君御世永歌昌梁白紵舞歌武帝古今樂録曰梁三朝樂第二十設巾舞並白紵蓋巾舞以白紵四解送也朱絲玉柱羅象筵飛琯促節舞少年短歌流目未肯前含笑一轉私自憐纎腰嫋嫋不任衣嬌怨獨立特為誰赴曲君前未忍歸上聲急調中心飛四時白紵歌梁沈約古今樂録曰沈約云白紵五章敕臣約造武帝造後兩句春白紵蘭葉參差桃半紅飛芳舞縠戲春風如嬌如怨貌不同含笑流眄滿堂中翡翠羣飛飛不息願在雲間長比翼佩服瑶草駐容色舜日堯年歡無極夏白紵朱光灼爍照佳人含情送意遙相親嫣然宛轉亂心神非子之故欲誰因翡翠羣飛飛不息願在雲間長比翼佩服瑶草駐容色舜日堯年歡無極秋白紵白露欲凝草已黃金琯玉柱響洞房雙心一意俱徊翔吐情寄君君莫忘翡翠羣飛飛不息願在雲間長比翼佩服瑶草駐容色舜日堯年歡無極冬白紵寒閨晝寢羅幌垂婉容麗心長相知雙去雙還誓不移長袖拂靣為君施翡翠羣飛飛不息願在雲間長比翼佩服瑶草駐容色舜日堯年歡無極夜白紵秦筝齊瑟燕趙女一朝得意心相許明月如規方襲豫夜長未央歌白紵翡翠羣飛飛不息願在雲間長比翼佩服瑶草駐容色舜日堯年歡無極白紵歌鮑照吳刀楚製為佩褘纎羅霧縠垂羽衣含商咀徵歌露晞珠屣一作履颯沓紈袖飛淒風夏起素雲回車怠馬煩客忘歸蘭膏明燭承夜暉桂宫柏寢一作梁擬天居朱爵文窗韜綺疏象床瑶席鎮犀渠雕屏鉿一作匼匝組帷舒秦筝趙瑟挾笙竽垂鐺散珮一作綬盈玉除停觴不語欲誰須三星參差露沾濕弦悲管淸月將入寒光蕭條候蟲急荆王流歎楚妃泣紅顔難長時易戢凝華結藻一作彩久延立非君之故豈妄集池中赤鯉庖所捐琴高乘雲騰一作飛上天命逢福世丁溢恩簮金藉綺升曲筵思君厚德委如山潔誠洗志期暮年烏白馬角寧足言朱脣動素腕一作袖舉洛陽少童邯鄲女古稱渌水今白紵催弦急管為君舞窮秋九月荷葉黃北風驅鴈天雨霜夜長酒多樂未央春風淡蕩俠思多天色淨緑氣妍和桃含紅蕚蘭一作連紫牙朝日灼爍發園花卷幌結帷羅玉筵齊謳秦吹盧女弦千金顧笑買芳年古樂府卷八
